# checkout-parity.conf — OPS-HOST-DEPLOY-PROVENANCE-ROLLOUT-W1
#
# THE declared set of git-checkout services whose provenance is asserted daily by
# ops/cron/checkout-parity.sh. One file, one consumer — unlike algovault-bot.manifest, which is
# shared with the deploy tool, this config is read only by the canary, because these services
# are placed by git (GHA or a host `git pull`), not by ops/scripts/host-deploy.sh.
#
# ── Why these three and not "the remaining six" ──────────────────────────────
# Step 0 re-derived the estate and falsified the rollout premise three ways:
#   1. `algovault-editorial` and `algovault-blog-assets` ARE git checkouts with origins. The bot
#      wave's R0 read `git rev-parse`'s "detected dubious ownership" refusal as "not a git
#      checkout" and counted them among the unprovenanced. My error, propagated into a spec.
#   2. The services that genuinely share the bot's class — algovault-carry, algovault-monitoring,
#      mcp-spec-watcher, algovault-distribution-reminders — have NO SOURCE REPO AT ALL
#      (`gh repo list AlgoVaultLabs` returns none). You cannot `git archive` a repo that does not
#      exist, so the primitive cannot reach them. Blocker wave:
#      OPS-CREATE-REPO-FOR-HOST-SERVICES-W{NEXT}.
#   3. `algovault-mcp` and `mcp-intelligence` are git repos with NO ORIGIN, so there is no shared
#      ref to assert ancestry against — which is the entire mechanism.
# Net: zero services were wireable with the SHA-pinned primitive. What these three DO lack is a
# stamp and a parity check, which is what this canary supplies.
#
# Format — `<verb> <service> <value>  # reason`
#   service         <name> <path>:<owner>   a checkout to assert; owner is the expected file owner
#   allow           <name> <glob>           a path that is EXPECTED dirty, with the reason it is
#   allow_manifest  <name> <relpath>        DERIVE the expected-dirty set from a manifest inside
#                                           that service's own checkout, resolved at run time.
#                                           Fails CLOSED: unreadable / unparseable / zero targets
#                                           => INDETERMINATE, never a silent fall-back to `allow`.
#
# An `allow` is a declaration, never an inference. crypto-quant-signal-mcp is dirty on every
# single deploy by design — `scripts/snapshot-landing-data.mjs` rewrites baked SoT literals on
# the host AFTER `git pull` — so a bare "working tree is clean" assertion would fire daily and
# be muted within a week. Declaring the injector's own output is what keeps the check credible.
#
# ── Why the injector's set is DERIVED and no longer enumerated here ──────────
# OPS-CHECKOUT-PARITY-ALLOWLIST-DERIVE-W1. Enumerating it meant TWO files independently asserted
# the same fact — "which paths does the deploy-time generator rewrite" — and only one of them was
# the SoT. The copy went stale three times, across two waves, each time by a commit that added an
# injector target and left this file untouched:
#
#   97fc7ef  OPS-AUDIT-REMEDIATION-LOW-W2             added docs-src/template.html
#   736f257  OPS-AUDIT-REMEDIATION-LOW-W2 (SEC-46)    expanded it to the served pages
#   cf84bc3  OPS-JSONLD-PFE-PROPERTYVALUE-MANAGE-W1   added docs-src/partials/*.html
#
# The cost was a daily 🛑 CHECKOUT_PARITY_SIGNAL_MCP naming docs-src/template.html — a file that is
# legitimate, declared generator output. Correct about the fact, wrong about the meaning; and an
# alert that is wrong about the meaning is the kind that gets muted. A fourth hand-copied row would
# only re-arm the trap for the fifth target, so the duplicated fact is DELETED rather than
# re-synced (CLAUDE.md: "a duplicated fact goes stale — point at the SoT"). A future wave that adds
# a manifest row now inherits coverage here with ZERO edits to this file.

service  crypto-quant-signal-mcp   /opt/crypto-quant-signal-mcp:root:root

# THE injector's own target set, derived from the SoT that already declares it. The union of every
# claims[].apply_to_files[] IS that set by construction: snapshot-landing-data.mjs builds
# `claimsByFile` exclusively from that field. Resolved per-run by scripts/injector-target-set.mjs
# against THIS service's checkout, so the canary judges the manifest the host actually has.
allow_manifest  crypto-quant-signal-mcp  scripts/snapshot-landing-manifest.json

# The two rows below are a deliberately retained SUPERSET, not the injector's target set — that
# claim is what went stale above, and it now lives on the allow_manifest row. They are kept because
# the deploy ALSO `cp`s landing/*.html to /var/www/algovault/, and README.md is rewritten by the
# daily ops/cron/snapshot-landing-daily.sh re-bake as well as by the deploy-time injector. Dropping
# them to rely on derivation alone would risk a false FAIL from a host writer this wave has not
# enumerated. Overlap with the derived set is intentional and harmless — the union is what matters.
allow    crypto-quant-signal-mcp   README.md         # superset: injector + daily re-bake writer
allow    crypto-quant-signal-mcp   landing/*.html    # superset: also the `cp … /var/www/algovault/`
                                                     # webroot sync path. Measured dirty 2026-08-06:
                                                     # README.md + 51 landing/*.html + the derived
                                                     # docs-src/template.html

service  algovault-editorial       /opt/algovault-editorial:algovault:algovault
# no allow rows — measured clean (dirty=0) on 2026-08-02; it has no host-side injector

service  algovault-blog-assets     /opt/algovault-blog-assets:algovault:algovault
# no allow rows — measured clean (dirty=0); static assets, no units, no cron

# ── deliberately NOT asserted here, so the gap is declared rather than forgotten ──
# DEFER  algovault-carry            no source repo; holds .venv in the deploy root; 29 uid-501 files
# DEFER  algovault-monitoring       no 1:1 repo; already governed by monitoring-inventory.json +
#                                   monitoring-inventory-reconcile.py (HASH_DRIFT/ORPHAN/DIVERGENT_COPY).
#                                   A second mechanism would fight the first.
# DEFER  mcp-intelligence           git repo with NO origin -> no shared ref to assert ancestry against
# DEFER  algovault-mcp              same, and same SHA as mcp-intelligence — identify the duplication first
# DEFER  mcp-spec-watcher           .env sits in the deploy root; no repo
# EXEMPT algovault                  nested stale copy of the signal repo; no units, no cron
# EXEMPT algovault-editorial-old-*  archival by name
# EXEMPT piper-tts                  vendored third-party binary, decom-flagged
# EXEMPT plausible-ce               upstream third-party (plausible/community-edition)
# EXEMPT algovault-editorial-content  content repo, no runtime role
# EXEMPT algovault-distribution-reminders  a single send.sh, no units, no cron
