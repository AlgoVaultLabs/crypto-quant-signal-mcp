  # ── OPS-FRESHNESS-SOURCE-TRUTH-W1 (2026-07-28) ──────────────────────────────
  # VERIFY_LATEST_BATCH_FRESH is RETIRED and split into the two rows below.
  #
  # What it did wrong: tolerance_type FRESH derived its measured value from
  # claim_pattern (a page scrape) while naming the merkle PUBLISHER. The scraped
  # literal is a deploy-time bake, so the row actually measured
  # max(deploy_gap, publish_gap) > 2d and had ZERO power to discriminate "we did not
  # deploy for 3 days" (benign) from "the publisher died" (P0). Its sot_endpoint /
  # sot_jq were declared and never read — the FRESH branch discarded sot_value.
  # It fired 2026-07-27 12:00:04Z at days_since=2.50d and sent the operator to
  # investigate a publisher with a 100/100 record. Same mis-attribution was already
  # noted in the May-2026 audit and never acted on.
  #
  # Do NOT reintroduce a page-sourced FRESH row: website-drift-canary.py now
  # fail-CLOSED rejects any FRESH row lacking freshness_source (exit 3).

  # The publish-liveness alarm. Reads the PRODUCER. Never a page.
  - alert_id: MERKLE_PUBLISH_LIVENESS
    page_url: https://algovault.com/verify   # fetched only to keep the row loop uniform; NOT the measured value
    claim_pattern: 'data-tr-field="latest_batch_at"[^>]*>([^<]+)'
    extract_method: regex_first_match
    freshness_source: sot
    sot_endpoint: https://api.algovault.com/api/merkle-batches
    # max_by, not .batches[0]: [0] IS newest today, but relying on server-side array
    # order would let a future ordering change silently INVERT the alarm with no test
    # coverage. max_by is lexicographic-safe on fixed-width ISO-8601 Z strings. The
    # sub() strips fractional seconds — `fromdateiso8601` THROWS on "…04.390Z"
    # (live-reproduced), which is itself proof the old row's sot_jq never executed.
    sot_jq: '.batches | max_by(.published_at) | .published_at | sub("\\.[0-9]+Z$";"Z") | fromdateiso8601 | (now - .) / 86400'
    tolerance_type: FRESH
    tolerance_value: 0.5
    producer_cadence_hours: 24
    tg_fires: true
    recommended_wave: OPS-MERKLE-PUBLISH-RESTORE-W{NEXT}
    notes: >
      Merkle batches publish daily at 00:05 UTC (crontab `5 0 * * *`); observed tail
      00:05:15.823. This canary runs 00:57 UTC -> run_offset 0.867h. Healthy reading
      ~0.036d; ONE missed batch ~1.036d -> fires the same morning, ~52min after the miss.
      Threshold must stay inside the cadence-coherence band
      (run_offset_h/24, (24+run_offset_h)/24) = (0.0361, 1.0361); 0.5 sits mid-band.
      MOVING EITHER CRON REQUIRES MOVING THIS THRESHOLD — the load-time coherence assert
      enforces it against canary_run_minute_utc / producer_fire_minute_utc above.
      Single-fire (no consecutive_breaches_required): a missed publish IS the incident.

  # The page-copy alarm. Honestly named, honestly attributed.
  - alert_id: VERIFY_BAKED_BATCH_COPY_DRIFT
    page_url: https://algovault.com/verify
    claim_pattern: 'data-tr-field="latest_batch_at"[^>]*>([^<]+)'
    extract_method: regex_first_match
    sot_endpoint: https://api.algovault.com/api/merkle-batches
    sot_jq: '.batches | max_by(.published_at) | .published_at'
    tolerance_type: EXACT_ISO_MINUTE   # normalises "2026-07-25 00:05 UTC" vs "2026-07-25T00:05:04.390Z"
    consecutive_breaches_required: 2
    tg_fires: true
    recommended_wave: OPS-SNAPSHOT-INJECTOR-RESTORE-W{NEXT}
    notes: >
      Guards the daily re-bake (ops/cron/snapshot-landing-daily.sh, 00:39 UTC). A fire means
      the RE-BAKE stopped, NOT that publishing stopped — distinct alert_id so the two can
      never conflate again. Requires 2 CONSECUTIVE breaches: the injector self-heals every
      day, so a one-day transient must not page (same sustain principle as
      REGRESSION_CONFIRM_RUNS). Streak state lives in .drift-canary-state/, not the TTL'd
      cache, so a cache wipe cannot reset it.

  # The producer-liveness alarm for the daily re-bake itself (C4/R4.1).
  # C2 added a SCHEDULED producer that is FAIL-OPEN by design (unreachable SoT -> exit 0).
  # Unwatched, that is a new silent-failure surface: "the thing that keeps everything fresh
  # died quietly". This row is what makes the fail-open safe.
  # No page_url — a producer-liveness row measures the producer, never a rendered artifact.
  - alert_id: SNAPSHOT_INJECTOR_HEARTBEAT_FRESH
    freshness_source: sot
    # Attempt-recency stamp written at job START by ops/cron/snapshot-landing-daily.sh.
    # ATTEMPT, not output: a day when the SoT is unreachable legitimately produces no
    # change, and an output-recency probe would page for a fault that never happened
    # (CLAUDE.md producer-liveness rule). A missing file = never stamped = bootstrap
    # report-not-page, not a fire.
    sot_endpoint: file:///var/lib/algovault-monitoring/snapshot-landing-heartbeat
    sot_jq: '(now - .) / 86400'
    tolerance_type: FRESH
    tolerance_value: 1.5
    producer_cadence_hours: 24
    producer_fire_minute_utc: 39     # the injector's minute, NOT the merkle publish :05
    missed_cycles_tolerated: 2       # self-healing producer: one missed day is not an incident
    tg_fires: true
    recommended_wave: OPS-SNAPSHOT-INJECTOR-RESTORE-W{NEXT}
    notes: >
      Injector fires 00:39, this canary 00:57 -> run_offset 0.3h. Healthy reading ~0.0125d.
      With missed_cycles_tolerated: 2 the coherence band is (0.0125, 2.0125), so 1.5d fires
      only after the producer has skipped a full day AND is well into the next — one missed
      run self-heals at the next fire and must not page. Declaring the tolerance (rather than
      just picking 1.5) is what keeps the band assert meaningful.

  # ============================ /how-it-works ============================

  - alert_id: HIW_VERIFIED_CALLS_PROSE_EXACT
    page_url: https://algovault.com/how-it-works
    claim_pattern: 'across\s+([0-9]+)\s+verified\s+calls'
    extract_method: regex_first_match
    transform: int(match)
    sot_endpoint: https://api.algovault.com/api/performance-public
    sot_jq: .totalCalls
    tolerance_type: FLOOR  # OPS-LANDING-AUTO-ALIGN-W1 (2026-05-25): EXACT->FLOOR for monotonic-grow counter; fires only on SoT regression
    tg_fires: true
    recommended_wave: OPS-HIW-COPY-REFRESH-W{NEXT}

  - alert_id: HIW_CALL_COUNT_DTRF_EXACT
    page_url: https://algovault.com/how-it-works
    claim_pattern: 'data-tr-field="call_count"[^>]*>([0-9,]+)'
    extract_method: regex_first_match
    transform: 'int(match.replace(",",""))'
    sot_endpoint: https://api.algovault.com/api/performance-public
    sot_jq: .totalCalls
    tolerance_type: FLOOR  # OPS-LANDING-AUTO-ALIGN-W1 (2026-05-25): EXACT->FLOOR for monotonic-grow counter; fires only on SoT regression
    tg_fires: true
    recommended_wave: OPS-HIW-COPY-REFRESH-W{NEXT}

  - alert_id: HIW_PFE_DTRF_BAND
    page_url: https://algovault.com/how-it-works
    claim_pattern: 'data-tr-field="pfe_wr"[^>]*>([0-9.]+)%'
    extract_method: regex_first_match
    transform: float(match)
    sot_endpoint: https://api.algovault.com/api/performance-public
    sot_jq: .overall.pfeWinRate * 100
    tolerance_type: BAND
    tolerance_value: 3
    tg_fires: true
    recommended_wave: OPS-HIW-COPY-REFRESH-W{NEXT}

  - alert_id: HIW_MERKLE_DTRF_EXACT
    page_url: https://algovault.com/how-it-works
    claim_pattern: 'data-tr-field="merkle_batch_count"[^>]*>([0-9]+)'
    extract_method: regex_first_match
    transform: int(match)
    sot_endpoint: https://api.algovault.com/api/merkle-batches
    sot_jq: .batch_count  # OPS-FRESHNESS-SOURCE-TRUTH-W1 C3.6 (2026-07-28): was `.batches | length`, which counts a 100-row CAPPED projection — batch_count was 109 while both page and SoT read 100, so the row was structurally blind to a monotonically diverging under-report. `.batch_count` is registered in MONOTONIC_SOT_SIGNATURES in the same change, so the FLOOR coercion below is preserved (dropping the old accessor without registering the new one would have re-introduced the 2026-06-29 false-fire class).
    tolerance_type: FLOOR  # OPS-MERKLE-DRIFT-TOLERANCE-W1 (2026-06-29): EXACT->FLOOR for monotonic-grow counter (batches only ever added); deploy-baked static fallback necessarily lags the live SoT between deploys, so EXACT false-fired on the normal +1 gap (the 2026-06-29 79-vs-80 alert). Missed by OPS-LANDING-AUTO-ALIGN-W1's .totalCalls sweep. Now enforced by the monotonic-counter guard in website-drift-canary.py.
    tg_fires: true
    recommended_wave: OPS-HIW-COPY-REFRESH-W{NEXT}

  - alert_id: HIW_VENUE_LIST_ENUM_EXACT_SET
    page_url: https://algovault.com/how-it-works
