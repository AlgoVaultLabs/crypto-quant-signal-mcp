# website-drift-manifest.yaml
# OPS-DASHBOARD-DRIFT-CANARY-W1 — Whole-website data congruency canary
# Architect-ratified at Plan-Mode 2026-05-24 (Q-A approved 28 rows as-is).
#
# Per-metric-class drift contract (THE LAW):
#   FLOOR    -> page-claim <= SoT-API (monotonic counts with "+")            -> tg_fires:false
#   EXACT    -> page-claim == SoT-API (exact count without "+")              -> tg_fires:true
#   BAND     -> |page-claim - SoT-API| <= tolerance_value (percentage points) -> tg_fires:true
#   EXACT_SET -> set(page-extracted) == set(SoT-API-keys), order-insensitive  -> tg_fires:true
#   EXACT_SUBSTRING_LOWER -> sot.lower() appears in page-extracted set        -> tg_fires:true
#   FRESH    -> (now - page-date) <= tolerance_value (days)                   -> tg_fires:true
#
# MONOTONIC-COUNTER LAW (OPS-MERKLE-DRIFT-TOLERANCE-W1, 2026-06-29):
#   A cumulative counter that physically only ever GROWS (trade calls .totalCalls,
#   Merkle batches .batches|length) renders on the page as a deploy-baked static
#   fallback that NECESSARILY lags the live SoT between deploys. EXACT/BAND on such a
#   counter false-fires on the normal lag (page understating a growing number is not
#   data loss). Such rows MUST be tolerance_type: FLOOR — fires only when the SoT
#   REGRESSES below the page's claimed floor (a real over-claim / data-integrity event).
#   website-drift-canary.py's monotonic-counter guard AUTO-CORRECTS this: any REGISTERED
#   monotonic accessor (MONOTONIC_SOT_SIGNATURES, host-/whitespace-agnostic) or any row
#   with `monotonic: true` that is tagged non-FLOOR is coerced to FLOOR at load + raises a
#   CONFIG_VIOLATION alert. NOTE — this is an ALLOWLIST guard, not a universal detector: a
#   brand-new cumulative accessor left EXACT still false-fires on the normal lag (fails
#   toward NOISE, so it self-announces) until registered. Adding a NEW cumulative-counter
#   accessor => add its (sot_endpoint, sot_jq) to MONOTONIC_SOT_SIGNATURES OR set
#   `monotonic: true` on the row.
#
# CROSS-RUN DETECTORS (OPS-DRIFT-CANARY-MONOTONIC-DETECTOR-W1, 2026-06-29) — close the
# two gaps the W1 adversarial review found. State persists in
# `/opt/algovault-monitoring/.drift-canary-state/monotonic-state.json` (NOT CACHE_DIR, which
# is wiped). BOTH ship REPORT-ONLY first (DRY_RUN-first); promote to TG via env when stable.
#   - HIGH-WATER-MARK: per (endpoint,jq) peak SoT across runs. A registered counter whose
#     live SoT stays BELOW its recorded peak for REGRESSION_CONFIRM_RUNS consecutive runs
#     (a single transient read never fires) emits `WEBSITE_DRIFT_MONOTONIC_REGRESSION`
#     once-per-incident — real data-loss caught independent of the lagging deploy-baked page
#     floor (the "blind window"). Deduped vs a same-run FLOOR break. Observed even when the
#     page row's extract fails (direct SoT fetch). MONOTONIC_REGRESSION_TG=1 to promote to TG.
#     Legitimate baseline drop => reset the peak (rm the state file).
#   - GROWTH-HISTORY: an UNREGISTERED EXACT INTEGER counter that grows monotonically over
#     SUSPECT_MIN_RUNS raises a REPORT-ONLY `SUSPECTED_UNREGISTERED_MONOTONIC` nudge
#     (MONOTONIC_SUSPECT_TG=1 to promote) → register it. Catches the (N+1)th counter the
#     allowlist can't. Constants (net-growth 0) + percentages (non-integer) are excluded.
#   - HARDENING shipped by OPS-DRIFT-CANARY-MONOTONIC-PROMOTE-W1 (2026-06-29): single-run
#     SPIKE REJECTION (a new high locks only after a 1-run confirmation, so a transient HIGH/
#     LOW can't poison the peak); operator-ack reset via `MONOTONIC_HWM_RESET='<jq-substr>'|
#     'all'` (matched against the JQ accessor only); a wiped/corrupt state file restores from a
#     rotated `.bak` + raises `WEBSITE_DRIFT_MONOTONIC_STATE_RESET`; sig-collision guard over
#     CANONICAL hosts; stale entries (> STATE_PRUNE_DAYS) pruned; non-independent re-runs
#     (cached SoT) skipped so the 2-run confirmation can't be satisfied by one read.
#   - HONEST SCOPE (3-round adversarial review): the HWM has an inherent spike-vs-lag
#     tradeoff — for a strictly-growing counter the confirmed peak lags by ~1 step, so a
#     regression smaller than one growth-step at a fresh peak / a flapping counter are NOT
#     caught. It reliably catches the realistic threat (a LARGE sustained drop in an
#     append-only counter). RECOMMENDATION: keep the regression channel REPORT-ONLY as a
#     forensic backstop; the PRIMARY regression controls are the FLOOR over-claim check + the
#     on-chain↔dashboard equality canary. Promote to live TG (`MONOTONIC_REGRESSION_TG=1`)
#     only with eyes open to those documented blind spots.
#
# All TG-fire alerts inherit OPS-MONITORING-TELEGRAM-INTEGRATION-W1's contract:
#   severity=CRITICAL_PERSISTENT; 24h cooldown per alert_id; body includes recommended wave ID.

# ── CADENCE DECLARATIONS (OPS-FRESHNESS-SOURCE-TRUTH-W1, 2026-07-28) ──
# Read by lint_freshness_rows() to assert cadence coherence on every freshness_source: sot
# row. These are DECLARATIONS OF THE INSTALLED CRONTAB, not configuration — if you move
# either cron, update the matching value here or the canary fail-CLOSED refuses to run
# (exit 3). That is the point: a cron move can no longer silently blind a freshness alarm.
#   producer_fire_minute_utc — merkle publish, crontab `5 0 * * *`
#   canary_run_minute_utc    — this canary,    crontab `57 0 * * *`
# (Between them, ops/cron/snapshot-landing-daily.sh re-bakes at `39 0 * * *`. Minutes :09
#  and :39/:57 were chosen because :13 and :23 — the original spec defaults — are both
#  occupied on 204; only :09, :39, :57 are free in hour 00.)
producer_fire_minute_utc: 5
canary_run_minute_utc: 57

