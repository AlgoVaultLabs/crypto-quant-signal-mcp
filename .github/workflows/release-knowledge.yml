name: Release Knowledge Bundle

# KNOWLEDGE-ARTIFACT-W1 (2026-05-18) — auto-attach the generated knowledge
# JSON bundle to every `npm version`-driven GitHub Release. Trigger: tag push
# matching v*. Independent from the main Hetzner deploy workflow (deploy.yml
# runs on push:main; this runs on push:tags).
#
# Bundle path inside the runner after `npm run build:knowledge`:
#   dist/knowledge/algovault-knowledge-v<VERSION>.json
#   dist/knowledge/latest.json
#   dist/knowledge/index.json
#
# Drift contract: audits/knowledge-shape-snapshot-2026-05-18.json.

on:
  push:
    tags:
      - 'v*'

# ─── CONCURRENCY — OPS-SERIALIZE-LANDING-AND-DEPLOY-W1 CH3 ───────────────────────────────────
#
# THE GROUP KEY IS A FUNCTION OF THE RESOURCE, NEVER OF THE CONTAINER. That is this repo's
# existing freshness law ("a freshness key is a function of what it verifies, never of the
# container holding it") reappearing in a new domain. PER-REF, same reasoning as publish-npm.yml: a cancelled pending run means a release with no
# knowledge bundle attached, and nothing fails.
#
# `queue: max`, never the `single` default: waves cite run IDs as acceptance evidence, and a run
# cancelled while PENDING is not a failure anywhere — it is simply missing. `max` lets every run
# survive to a verdict. Proven ACCEPTED and MEASURED on a throwaway branch before any rollout
# (run 32396494418 validated and ran; two further runs dispatched into the same group both stayed
# `pending` rather than the earlier one being cancelled, which is `max` behaving as documented and
# is what the `single` default would NOT have done).
#
# The knob that governs PENDING runs is `queue`. The OTHER one is deliberately absent everywhere
# in this repo: it scopes to the in-progress run, its `false` value appears nowhere in GitHub's
# documentation, and combining it with `queue: max` is an explicit workflow validation error.
#
# Group names are CASE-INSENSITIVE per the docs — never rely on case to distinguish two groups.
#
# No job-level concurrency block: GitHub does not document how workflow-level and job-level
# groups interact, and a load-bearing safety property must never be rented from undocumented
# behaviour. Declared in ops/shared-worktree-state.json (`ci-workflow-release-knowledge`) and asserted in BOTH
# directions by scripts/check-shared-state.mjs + tests/unit/workflow-concurrency.test.ts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max


jobs:
  release-knowledge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # OPS-RUNTIME-NODE24-W1: track the runtime (Node 20 EOL 2026-04-30)
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Compile TS
        run: npm run build

      - name: Build knowledge bundle
        run: npm run build:knowledge

      - name: Verify knowledge artifacts exist
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          test -f "dist/knowledge/algovault-knowledge-v${VERSION}.json" || (echo "missing versioned bundle"; exit 1)
          test -f "dist/knowledge/latest.json"   || (echo "missing latest.json"; exit 1)
          test -f "dist/knowledge/index.json"    || (echo "missing index.json";  exit 1)
          diff "dist/knowledge/algovault-knowledge-v${VERSION}.json" "dist/knowledge/latest.json" >/dev/null || (echo "latest.json drift vs versioned bundle"; exit 1)
          jq -e 'has("version") and has("generated_at") and has("tools") and has("response_shapes") and has("integrations") and has("examples") and has("discussions") and (has("outcome_return_pct") | not)' "dist/knowledge/latest.json" >/dev/null
          echo "KNOWLEDGE_BUNDLE_OK"

      - name: Attach bundle to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/knowledge/algovault-knowledge-*.json
            dist/knowledge/latest.json
            dist/knowledge/index.json
          fail_on_unmatched_files: true
          generate_release_notes: true
