# OPS-POSTGRES-TEST-LANE-W1 — run the suite against the engine production actually uses.
#
# WHY THIS EXISTS. Production is Postgres; the ~4,940-test suite is SQLite. Every Postgres-only
# SQL string — ON CONFLICT targets, `::` casts, `interval '…'`, percentile_cont, RETURNING,
# ADD COLUMN IF NOT EXISTS, matview refreshes — was validated by nothing.
#
# The instance that got caught: `tryClaimPayment`'s PG branch kept `ON CONFLICT (nonce)` after the
# primary key became (payer_wallet, nonce). Postgres answered every claim with "there is no unique
# or exclusion constraint matching the ON CONFLICT specification", the fail-safe returned false,
# and the paid x402 rail served nothing for ~25 hours — through a fully green suite, because every
# test takes the SQLite branch (`INSERT OR IGNORE`, which has no ON CONFLICT clause at all). It was
# found by an unrelated read-only probe, not by any gate.
#
# CLAUDE.md already prescribed the remedy ("gate the suite on DATABASE_URL presence —
# describe.skipIf when unset"), and the tests are ALREADY authored in that shape. They had never
# run, because CI had no database. The law existed; the lane did not.
#
# ── Why this is a SEPARATE workflow and not a step in deploy.yml ──────────────
# deploy.yml runs only on push-to-main and gates the deploy. Adding a never-before-executed lane
# straight into that path would either block every deploy on first contact, or be quietly softened
# until it stopped meaning anything. This runs on EVERY branch so the lane can be measured and
# triaged before it is allowed to gate anything, and it is `continue-on-error` for exactly as long
# as its own baseline says it must be — see POSTGRES_LANE_ENFORCING below.
name: Postgres test lane

on:
  push:
    branches: ['**']
  workflow_dispatch:

# ─── CONCURRENCY — OPS-SERIALIZE-LANDING-AND-DEPLOY-W1 CH3 ───────────────────────────────────
#
# THE GROUP KEY IS A FUNCTION OF THE RESOURCE, NEVER OF THE CONTAINER. That is this repo's
# existing freshness law ("a freshness key is a function of what it verifies, never of the
# container holding it") reappearing in a new domain. The postgres this talks to is an EPHEMERAL service container inside the runner, created and
# destroyed per run, so `contended_target` is none. Per-ref because this triggers on
# branches:['**'] and the only thing worth de-duplicating is repeated pushes to the SAME branch;
# a global group would make every branch queue behind every other.
#
# `queue: max`, never the `single` default: waves cite run IDs as acceptance evidence, and a run
# cancelled while PENDING is not a failure anywhere — it is simply missing. `max` lets every run
# survive to a verdict. Proven ACCEPTED and MEASURED on a throwaway branch before any rollout
# (run 32396494418 validated and ran; two further runs dispatched into the same group both stayed
# `pending` rather than the earlier one being cancelled, which is `max` behaving as documented and
# is what the `single` default would NOT have done).
#
# The knob that governs PENDING runs is `queue`. The OTHER one is deliberately absent everywhere
# in this repo: it scopes to the in-progress run, its `false` value appears nowhere in GitHub's
# documentation, and combining it with `queue: max` is an explicit workflow validation error.
#
# Group names are CASE-INSENSITIVE per the docs — never rely on case to distinguish two groups.
#
# No job-level concurrency block: GitHub does not document how workflow-level and job-level
# groups interact, and a load-bearing safety property must never be rented from undocumented
# behaviour. Declared in ops/shared-worktree-state.json (`ci-workflow-postgres-lane`) and asserted in BOTH
# directions by scripts/check-shared-state.mjs + tests/unit/workflow-concurrency.test.ts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max


jobs:
  postgres-lane:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the version production runs — READ FROM THE LIVE HOST, not assumed:
        # `docker inspect crypto-quant-signal-mcp-postgres-1 --format '{{.Config.Image}}'`
        # → postgres:16-alpine (server_version 16.13), probed 2026-08-04.
        # A lane on a different major would validate SQL production never executes.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: algovault
          # Generated per-run, never a literal. A committed `postgres://user:pass@host` DSN in a
          # PUBLIC repo is flagged by the secret-scan gate (Gate B: dsn-password / assigned-secret)
          # and it is RIGHT to flag it — a credential-shaped literal is indistinguishable from a
          # real one to a scanner, and this repo has already shipped a live Postgres password once.
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: signal_performance_test
        ports:
          - 5432:5432
        # Without a health check the suite races the server's first-boot initdb and fails on
        # connection refused, which reads exactly like a test failure and would be triaged as one.
        options: >-
          --health-cmd "pg_isready -U algovault -d signal_performance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Assembled at runtime from the per-run password (see the service block) so no DSN literal
      # is ever committed. The suites that are PG-aware key off DATABASE_URL presence alone.
      DATABASE_URL: postgres://algovault:${{ github.run_id }}@localhost:5432/signal_performance_test

    steps:
      # fetch-depth: 0 is LOAD-BEARING, not hygiene. actions/checkout defaults to depth 1 and
      # fetches ONLY the pushed ref, so on a BRANCH push `refs/remotes/origin/main` does not
      # exist in the runner at all. Measured from a real run's own log:
      #
      #   fetch --no-tags --prune --depth=1 origin +<sha>:refs/remotes/origin/<branch>
      #
      # check-test-budget.mjs asks `git merge-base HEAD origin/main` to decide which test files
      # this change touched. Without that ref the call throws, changedTestFiles() returns null,
      # and the gate CORRECTLY answers TEST_BUDGET_VERDICT=INDETERMINATE — it refuses to assume
      # nothing changed. The gate was never wrong; it was run somewhere it could not see.
      #
      # The tell is that the SAME sha produced two verdicts: 602449c passed on `main` (where the
      # pushed ref IS main, so the ref resolves) and failed on its branch. Identical tree, so the
      # differing input was the REF, not the code. A depth-1 fetch of main as a second step does
      # NOT fix it — two shallow tips share no reachable ancestor, so merge-base still fails.
      #
      # Cost measured before choosing: 1,412 commits / 158 MB, seconds against a lane that already
      # stands up Postgres and runs the whole suite. Cheap next to a gate that is dark on every
      # branch push — which is how a real red gets trained away.
      # (OPS-TEST-BUDGET-CI-REF-W1)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Compile TS
        run: npm run build

      - name: Confirm the database is actually reachable
        # An unreachable database must be INDETERMINATE, never a silent pass. If this step fails
        # the job fails loudly here rather than downstream, where "0 PG tests ran" would look
        # indistinguishable from "the PG lane is green".
        run: |
          node -e "
            const { Client } = require('pg');
            (async () => {
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              await c.connect();
              const r = await c.query('SELECT version()');
              console.log('connected:', r.rows[0].version.split(',')[0]);
              await c.end();
            })().catch((e) => { console.error('POSTGRES_LANE_VERDICT=INDETERMINATE — database unreachable:', e.message); process.exit(3); });
          "

      - name: Create the roles the migrations grant to
        # OPS-PG-LANE-BOOTSTRAP-W1. Seven migrations end in GRANTs to roles that exist on the
        # production box and nowhere else, so on this lane every one of them failed with
        # `role "algovault_app" does not exist` — twelve errors per run, all swallowed by the
        # step below, all noise that trained the eye past the REAL errors sitting beside them.
        #
        # DERIVED from the migrations rather than listed here: a hand-maintained role list is a
        # duplicated fact that goes stale the first time a migration adds a role, and this repo
        # has that failure mode written down twice already. The pattern is deliberately narrow
        # (`algovault_*` / `aoe_*`); a false positive costs one unused NOLOGIN role inside an
        # ephemeral container that is destroyed at the end of the job.
        #
        # NOLOGIN and no privileges of their own: the suite connects as the bootstrap superuser,
        # so these exist purely to make the GRANTs executable. Creating them means the lane now
        # exercises the privilege model instead of skipping past it.
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null 2>&1 || true
          ROLES=$(grep -rhoE '\b(algovault_[a-z0-9_]+|aoe_[a-z0-9_]+)\b' migrations/*.sql | sort -u)
          if [ -z "$ROLES" ]; then
            echo "no roles derived from migrations/ — nothing to create (not a failure)"
          fi
          for r in $ROLES; do
            echo "── role $r"
            psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -c \
              "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$r') THEN CREATE ROLE $r NOLOGIN; END IF; END \$\$;"
          done

      - name: Bootstrap the application schema — PG_BOOTSTRAP_VERDICT
        # OPS-PG-LANE-BOOTSTRAP-W1 — THE STEP THIS LANE NEVER HAD.
        #
        # `migrations/*.sql` is not the schema. Most tables are created by the app on first use,
        # and the migrations mostly ALTER or INDEX those tables — so on a fresh database the
        # migration step below was failing on `signals`, `request_log`, `quota_usage`,
        # `contact_leads` and `funnel_events` simply because nothing had created them yet.
        #
        # This drives the app's own DDL entrypoints and AWAITS them, then asserts every table
        # they declare actually exists, and prints exactly one
        # `PG_BOOTSTRAP_VERDICT=OK|INCOMPLETE|INDETERMINATE`. Non-OK fails the job HERE, where
        # "the schema is half-built" is legible, instead of downstream where it arrives as a
        # scatter of unrelated-looking test failures across whichever suites happened to touch
        # the missing tables first. (That is precisely how it arrived: three failures in
        # band-population-invariance.test.ts, a file with nothing to do with any of them.)
        #
        # Ordering with the app's own lazy DDL is what makes this deterministic — see
        # `DdlBarrier` and the `PgBackend.ddl` rationale. Before that barrier this step could
        # itself have raced, and a bootstrap that races is not a bootstrap.
        run: node scripts/bootstrap-pg-schema.mjs

      - name: Apply migrations
        # Runs AFTER the bootstrap above, so the tables these migrations ALTER and INDEX now
        # exist. Ordinal order.
        #
        # `ON_ERROR_STOP` is still deliberately OFF: several migrations are idempotent
        # re-statements of DDL the app also creates, and a duplicate-object notice is not a lane
        # failure.
        #
        # REPORT-ONLY, and named as such rather than left implicit: the residual error count is
        # printed but does not gate. Promoting it to a gate needs a DECLARED expected-column set
        # (a table existing does not mean a migration's ADD COLUMN landed), which is
        # `OPS-PG-LANE-MIGRATION-STRICT-W{NEXT}`. Printing the count is what makes the promotion
        # decidable from a real measurement instead of a guess — the previous form piped every
        # error into `grep … || true` and reported nothing at all.
        run: |
          : > /tmp/migrations.log
          for f in $(ls migrations/*.sql | grep -v '\.down\.sql$' | sort); do
            echo "── $f" | tee -a /tmp/migrations.log
            psql "$DATABASE_URL" -q -f "$f" 2>&1 | grep -viE 'already exists|NOTICE' | tee -a /tmp/migrations.log || true
          done
          ERRS=$(grep -c 'ERROR:' /tmp/migrations.log || true)
          echo "MIGRATION_RESIDUAL_ERRORS=${ERRS}  (report-only — see OPS-PG-LANE-MIGRATION-STRICT-W{NEXT})"

      - name: Suite — POSTGRES lane
        id: pg
        # continue-on-error while the lane is being triaged. This is NOT a soft gate forever: the
        # next step compares the result against a COMMITTED baseline, so a NEW failure fails the
        # job even today, and the baseline may only shrink.
        continue-on-error: true
        run: |
          set -o pipefail
          npx vitest run --reporter=default 2>&1 | tee /tmp/pg-lane.log
          echo "exit=${PIPESTATUS[0]}"

      - name: Compare against the committed lane baseline
        # The ratchet. A newly-failing PG test blocks; a known-failing one reports until its owner
        # fixes it. Baseline lives at audits/postgres-lane-baseline.txt, one test-FILE per line,
        # each with an owner + reason in the ledger beside it.
        run: node scripts/check-postgres-lane.mjs /tmp/pg-lane.log
