name: Publish to npm

# Auto-publish to npm on every `v*.*.*` tag push.
#
# Wired in NPM-PUBLISH-v1.17.0-W1 (2026-05-22) closing the long-standing manual
# `npm publish` gap per WIS `publish-npm-yml-gha-workflow-promotion-candidate`.
#
# AUTH: OIDC trusted publishing — Phase 2 DONE (OPS-NPM-DROP-PUBLISH-TOKEN-W1, 2026-07-25).
# The publish step carries NO `NODE_AUTH_TOKEN`, so `npm publish` authenticates via short-lived
# GitHub-Actions OIDC creds against the trusted-publisher config — no long-lived token to leak
# or rotate. Requires npm >= 11.5.1 + Node >= 22.14.0 (pinned below), a public repo,
# `package.json` `repository.url` exactly matching the repo, and `id-token: write` (all true).
# Provenance auto-generates under OIDC. npmjs.com config (VERIFIED CORRECT 2026-07-25, do not
# touch): package Settings -> Trusted Publisher -> GitHub Actions (org AlgoVaultLabs /
# repo crypto-quant-signal-mcp / workflow publish-npm.yml / environment blank / npm publish).
#
# ⚠️ PHASE-1 DESIGN FLAW (why v1.23.3 + v1.24.0 fell back to the token): setup-node's
# `registry-url` writes `.npmrc` with `_authToken=${NODE_AUTH_TOKEN}`; with that env SET on the
# publish step, npm authenticates with the token and NEVER performs the OIDC exchange — a present
# token WINS over OIDC. The "OIDC-preferred, token-fallback on the same step" model was invalid.
# Fix = delete the token env. **OIDC PROVEN by the tokenless v1.24.1 publish (run 30152218097).**
# The `NPM_TOKEN` secret has been REVOKED on npmjs.com + deleted from repo settings; the package is
# set to "require 2FA and disallow tokens". There is no token rollback — OIDC is the only path now.
# OIDC-proof signal (corrected): read the publish step's `NODE_AUTH_TOKEN` env echo — `***` = a real
# secret (token auth), `XXXXX-XXXXX-XXXXX-XXXXX` = setup-node placeholder (no secret → OIDC). The
# `npm notice ...tokens that bypass 2FA...` line is a generic deprecation notice printed on EVERY
# publish and is NOT an auth-path discriminator.
#
# Triggers ONLY on tag push (NOT on every commit to main) — keeps the release wave
# in control of when npm gets a new version. The daily release-wave does
# `npm version <bump>` + `git push --follow-tags` → this workflow fires.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write   # required for npm provenance attestation (Sigstore Rekor)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # OPS-RUNTIME-NODE24-W1: tracks the production runtime (Node 20 EOL 2026-04-30).
          # OIDC needs npm >= 11.5.1; Node 24 BUNDLES npm 11.16.0, so the floor is met with no
          # explicit npm upgrade step (Node 22 bundles npm 10.9.8 and did NOT meet it on its own).
          # 11.16.0 is also still < 12, so `npm ci` keeps its current install-script behaviour.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5.1 is required for OIDC trusted publishing. Pin to the latest 11.x
      # (NOT 12.x): npm 12 disables dependency install scripts by default, which would stop
      # the native `better-sqlite3` prebuild from building during `npm ci`. 11.18.0 keeps
      # install-scripts on so `npm ci` builds native deps AND satisfies the OIDC minimum.
      # Verified in OPS-NPM-TRUSTED-PUBLISHING-MIGRATION-W1: `npm ci` + `require('better-sqlite3')`
      # succeed on Node 22.23.1 + npm 11.18.0.
      - name: Pin npm (OIDC trusted-publishing capable, pre-v12 install defaults)
        run: npm install -g npm@11.18.0

      - name: Install deps
        run: npm ci

      - name: Compile TS
        run: npm run build

      # Refresh the published README's SNAPSHOT-LINE track-record numbers from live SoT
      # so the npm/GitHub README can never go stale. Wired by OPS-NPM-README-SINGLE-SOT-W1
      # (2026-05-31): the snapshot injector now covers README.md (manifest claims
      # dtrf-pfe-wr / dtrf-hold-rate / dtrf-readme-total-calls / dtrf-readme-merkle-batches).
      # Fail-open if SoT unreachable (exit 0 → publish proceeds with the committed fallbacks);
      # catastrophic >50%-zero-match → exit 1 (blocks publishing a structurally-drifted README).
      - name: Refresh README track-record numbers (snapshot injector)
        run: node scripts/snapshot-landing-data.mjs

      # OIDC trusted publishing: NO `NODE_AUTH_TOKEN` here — a present token makes npm skip the
      # OIDC exchange (see the Phase-1 design-flaw note in the header). With no token, npm
      # authenticates via OIDC against the verified trusted-publisher config, and `--provenance`
      # auto-generates. (The NPM_TOKEN secret has been revoked + deleted; OIDC is the only path.)
      - name: Publish to npm with provenance
        run: npm publish --provenance

      - name: Verify dist-tag
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(jq -r .version package.json)
          # npm registry replication lag — poll up to 3× at 20s
          for i in 1 2 3; do
            LIVE=$(curl -sS "https://registry.npmjs.org/crypto-quant-signal-mcp" | jq -r '.["dist-tags"].latest')
            if [ "$LIVE" = "$PACKAGE_VERSION" ]; then
              echo "DIST_TAG_OK: dist-tags.latest=$LIVE matches package.json.version=$PACKAGE_VERSION"
              exit 0
            fi
            echo "Attempt $i: dist-tags.latest=$LIVE, expected $PACKAGE_VERSION (replication lag)"
            sleep 20
          done
          echo "DIST_TAG_FAIL: dist-tags.latest still doesn't match after 60s"
          exit 1
