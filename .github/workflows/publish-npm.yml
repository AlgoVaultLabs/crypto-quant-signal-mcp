name: Publish to npm

# Auto-publish to npm on every `v*.*.*` tag push.
#
# Wired in NPM-PUBLISH-v1.17.0-W1 (2026-05-22) closing the long-standing manual
# `npm publish` gap per WIS `publish-npm-yml-gha-workflow-promotion-candidate`.
#
# AUTH: OIDC trusted publishing — Phase 2 DONE (OPS-NPM-DROP-PUBLISH-TOKEN-W1, 2026-07-25).
# The publish step carries NO `NODE_AUTH_TOKEN`, so `npm publish` authenticates via short-lived
# GitHub-Actions OIDC creds against the trusted-publisher config — no long-lived token to leak
# or rotate. Requires npm >= 11.5.1 + Node >= 22.14.0 (pinned below), a public repo,
# `package.json` `repository.url` exactly matching the repo, and `id-token: write` (all true).
# Provenance auto-generates under OIDC. npmjs.com config (VERIFIED CORRECT 2026-07-25, do not
# touch): package Settings -> Trusted Publisher -> GitHub Actions (org AlgoVaultLabs /
# repo crypto-quant-signal-mcp / workflow publish-npm.yml / environment blank / npm publish).
#
# ⚠️ PHASE-1 DESIGN FLAW (why v1.23.3 + v1.24.0 fell back to the token): setup-node's
# `registry-url` writes `.npmrc` with `_authToken=${NODE_AUTH_TOKEN}`; with that env SET on the
# publish step, npm authenticates with the token and NEVER performs the OIDC exchange — a present
# token WINS over OIDC. The "OIDC-preferred, token-fallback on the same step" model was invalid.
# Fix = delete the token env. **OIDC PROVEN by the tokenless v1.24.1 publish (run 30152218097).**
# The `NPM_TOKEN` secret has been REVOKED on npmjs.com + deleted from repo settings; the package is
# set to "require 2FA and disallow tokens". There is no token rollback — OIDC is the only path now.
# OIDC-proof signal (corrected): read the publish step's `NODE_AUTH_TOKEN` env echo — `***` = a real
# secret (token auth), `XXXXX-XXXXX-XXXXX-XXXXX` = setup-node placeholder (no secret → OIDC). The
# `npm notice ...tokens that bypass 2FA...` line is a generic deprecation notice printed on EVERY
# publish and is NOT an auth-path discriminator.
#
# Triggers ONLY on tag push (NOT on every commit to main) — keeps the release wave
# in control of when npm gets a new version.
#
# The release ritual LANDS FIRST, then tags the LANDED sha, then pushes the tag alone:
#   1. scripts/land.sh   2. LANDED=$(git rev-parse HEAD)   3. git tag -a vX.Y.Z "$LANDED"
#   4. git push origin vX.Y.Z   — refs/tags/* is its own namespace and needs no lock.
# NOT `git push --follow-tags`: land.sh REBASES, so a tag created before landing points at
# a rewritten-away commit — and the checkout below takes the TAG TREE, so npm would publish
# a tree that never landed. scripts/land.sh refuses that ordering outright (LAND_VERDICT=
# TAGGED). Corrected 2026-08-21, OPS-CI-MAIN-WRITER-HARDEN-W1 CH2 R3 — comment only.

on:
  push:
    tags:
      - 'v*.*.*'
  # workflow_dispatch — RELEASE-v1.28.0-AND-README-LINK-GATE-W1.
  #
  # The tag-triggered path is and remains canonical. This door exists because a tag-triggered
  # publish can fail on something that is fixed on `main` but frozen in the tag tree — which is
  # exactly what happened to v1.28.0: the tag carries a depth-1 checkout, so the publish could
  # never succeed from it no matter how many times it was re-run, while `main` carries the fix.
  # The alternative was deleting a tag a published GitHub Release already consumes.
  #
  # 🛑 A MANUAL PUBLISH DOOR IS ACCEPTABLE; AN UNGUARDED ONE IS NOT. Dispatched against an
  # arbitrary ref this would publish a tree that never landed — the hazard CLAUDE.md's REJECTED-B
  # tag-order LAW was written against, where npm shipped a tag tree that a rebase had orphaned and
  # nothing failed anywhere. The ancestor-of-`origin/main` guard below is what makes this door
  # safe, and it fails CLOSED. Do not remove one without removing the other.
  #
  # `mode` — OPS-DISTTAG-EVENTUAL-CONSISTENCY-W1 CH2 R5. `publish` (the default) is the release
  # lane. `verify-only` runs the WHOLE lane except `npm publish`. It re-verifies the CURRENT
  # package.json version against the registry and runs the Smithery leg. The ancestor guard runs
  # first and fails closed in BOTH modes. It exists to retire a stale FALSE red: npm published on
  # all four red releases v1.28.1–v1.31.0, and the gate misread propagation as failure. It is NOT a
  # substitute for a proven publish. A verify-only green is weaker in two independent ways:
  # `npm publish` never ran, and so `prepublishOnly`'s 38 segments never ran either (`npm publish`
  # triggers that lifecycle; `npm pack` does not). Its run log therefore says
  # NPM_PUBLISH_PERFORMED=false. `verify-only` is the ONLY non-default value, and the input exists on
  # workflow_dispatch only — never on push, never on a schedule
  # (tests/unit/publish-lane-invariants.test.ts INVARIANT 7).
  workflow_dispatch:
    inputs:
      mode:
        description: "publish (default) runs the release lane. verify-only re-verifies the current package.json version and runs the Smithery leg WITHOUT npm publish (and so without prepublishOnly)."
        type: choice
        options:
          - publish
          - verify-only
        default: publish

# ─── CONCURRENCY — OPS-SERIALIZE-LANDING-AND-DEPLOY-W1 CH3 ───────────────────────────────────
#
# THE GROUP KEY IS A FUNCTION OF THE RESOURCE, NEVER OF THE CONTAINER. That is this repo's
# existing freshness law ("a freshness key is a function of what it verifies, never of the
# container holding it") reappearing in a new domain. PER-REF, and this clause is what prevents a SILENT release loss: GitHub cancels a PENDING run
# when a new one joins the same group, so under a global group, tagging v1.2.4 while v1.2.3 was
# still pending would cancel the v1.2.3 publish — a version that never publishes, with nothing
# failing anywhere to alarm on. Keying on github.ref makes two versions structurally unable to
# share a group.
#
# `queue: max`, never the `single` default: waves cite run IDs as acceptance evidence, and a run
# cancelled while PENDING is not a failure anywhere — it is simply missing. `max` lets every run
# survive to a verdict. Proven ACCEPTED and MEASURED on a throwaway branch before any rollout
# (run 32396494418 validated and ran; two further runs dispatched into the same group both stayed
# `pending` rather than the earlier one being cancelled, which is `max` behaving as documented and
# is what the `single` default would NOT have done).
#
# The knob that governs PENDING runs is `queue`. The OTHER one is deliberately absent everywhere
# in this repo: it scopes to the in-progress run, its `false` value appears nowhere in GitHub's
# documentation, and combining it with `queue: max` is an explicit workflow validation error.
#
# Group names are CASE-INSENSITIVE per the docs — never rely on case to distinguish two groups.
#
# No job-level concurrency block: GitHub does not document how workflow-level and job-level
# groups interact, and a load-bearing safety property must never be rented from undocumented
# behaviour. Declared in ops/shared-worktree-state.json (`ci-workflow-publish-npm`) and asserted in BOTH
# directions by scripts/check-shared-state.mjs + tests/unit/workflow-concurrency.test.ts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max


permissions:
  contents: read
  id-token: write   # required for npm provenance attestation (Sigstore Rekor)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — RELEASE-v1.28.0-AND-README-LINK-GATE-W1, completing
      # OPS-TEST-BUDGET-CI-REF-W1's rollout.
      #
      # `prepublishOnly` runs `npm run test:budget:check`, and check-test-budget.mjs asks
      # `git merge-base HEAD origin/main`. The default depth-1 checkout of a TAG fetches only that
      # tag, so refs/remotes/origin/main does not exist, the gate correctly answers INDETERMINATE
      # (exit 3) — and blocks the publish. It is not a false positive: the gate cannot see, and it
      # says so rather than assuming nothing changed. The defect was this checkout.
      #
      # It went unnoticed because `prepublishOnly` runs ONLY on publish, so v1.28.0 was the gate's
      # first exercise in this lane — three hours after it shipped. Do not "simplify" this line
      # away; tests/unit/ci-git-context.test.ts now fails if it goes.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🛑 REFUSE A TREE THAT NEVER LANDED. Fails CLOSED, and runs before install and publish so a
      # bad ref costs nothing and reaches nothing.
      #
      # A publish materializes an explicit committed SHA that is an ancestor of the remote default
      # branch — the same rule ops/scripts/host-deploy.sh enforces for deploys. The tag-triggered
      # path gets this for free (scripts/land.sh lands first, then tags the re-read landed SHA);
      # the workflow_dispatch door does not, so it is asserted here.
      #
      # This is the guard for the measured incident behind CLAUDE.md's tag-order LAW: a tag created
      # BEFORE landing was orphaned by land.sh's rebase, publish-npm.yml checked out the TAG TREE,
      # and npm published a tree that never landed with nothing failing anywhere. `merge-base
      # --is-ancestor` is the predicate that would have caught it.
      - name: Refuse a tree that is not an ancestor of origin/main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          HEAD_SHA=$(git rev-parse HEAD)
          MAIN_SHA=$(git rev-parse origin/main)
          echo "HEAD=$HEAD_SHA"
          echo "origin/main=$MAIN_SHA"
          if git merge-base --is-ancestor "$HEAD_SHA" "$MAIN_SHA"; then
            echo "PUBLISH_ANCESTRY_VERDICT=PASS"
            echo "this tree landed on main — safe to publish"
          else
            echo "PUBLISH_ANCESTRY_VERDICT=FAIL"
            echo "::error::refusing to publish $HEAD_SHA — it is NOT an ancestor of origin/main ($MAIN_SHA). A publish must materialize a landed commit."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # OPS-RUNTIME-NODE24-W1: tracks the production runtime (Node 20 EOL 2026-04-30).
          # OIDC needs npm >= 11.5.1; Node 24 BUNDLES npm 11.16.0, so the floor is met with no
          # explicit npm upgrade step (Node 22 bundles npm 10.9.8 and did NOT meet it on its own).
          # 11.16.0 is also still < 12, so `npm ci` keeps its current install-script behaviour.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm >= 11.5.1 is required for OIDC trusted publishing. Pin to the latest 11.x
      # (NOT 12.x): npm 12 disables dependency install scripts by default, which would stop
      # the native `better-sqlite3` prebuild from building during `npm ci`. 11.18.0 keeps
      # install-scripts on so `npm ci` builds native deps AND satisfies the OIDC minimum.
      # Verified in OPS-NPM-TRUSTED-PUBLISHING-MIGRATION-W1: `npm ci` + `require('better-sqlite3')`
      # succeed on Node 22.23.1 + npm 11.18.0.
      - name: Pin npm (OIDC trusted-publishing capable, pre-v12 install defaults)
        run: npm install -g npm@11.18.0

      - name: Install deps
        run: npm ci

      - name: Compile TS
        run: npm run build

      # Refresh the published README's SNAPSHOT-LINE track-record numbers from live SoT so THE
      # NPM TARBALL can never ship a stale one. Wired by OPS-NPM-README-SINGLE-SOT-W1
      # (2026-05-31): the snapshot injector covers README.md (manifest claims
      # dtrf-pfe-wr / dtrf-readme-total-calls / dtrf-readme-merkle-batches).
      #
      # ⚠️ SCOPE — corrected by OPS-README-GIT-CHANNEL-PRODUCER-W1 (2026-09-10). This step used
      # to claim it kept "the npm/GitHub README" fresh. It never did, and could not: it rewrites
      # bytes in the RUNNER's checkout and NOTHING HERE COMMITS THEM, so what it guarantees is
      # the tarball `npm publish` packs and nothing else. The git channel that
      # raw.githubusercontent.com and every LLM crawler read is refreshed by
      # .github/workflows/readme-snapshot-writeback.yml (`17 1 * * *`), and the band gate
      # scripts/check-readme-snapshot-freshness.mjs is what fails when that producer dies.
      # (The retired `dtrf-hold-rate` is dropped from the claim list above — HOLD-DEEMPHASIS-
      # SWEEP-W1 removed it from the manifest on 2026-08-10, in the same commit as its spans.)
      #
      # Fail-open if SoT unreachable (exit 0 → publish proceeds with the committed fallbacks);
      # catastrophic >50%-zero-match → exit 1 (blocks publishing a structurally-drifted README).
      - name: Refresh README track-record numbers (snapshot injector)
        run: node scripts/snapshot-landing-data.mjs

      # Rebuild landing/docs.html AFTER the injector — NPM-PUBLISH-v1.28.2-W1.
      #
      # The injector's payload in this lane is README.md, which IS in package.json `files[]`.
      # But it also rewrites `landing/docs.html` (a GENERATED artifact) and `docs-src/template.html`
      # (the source that artifact is generated FROM), patching each independently with live
      # numbers. `prepublishOnly` then runs `build_docs.mjs --check`, which regenerates from the
      # freshly-injected template and compares against the freshly-injected artifact — and the two
      # do not agree. Measured 2026-08-26: `1748+ assets` -> `1771+`, plus the exchange_count span;
      # publish run 32980710335 died at prepublishOnly step 11 of 23 with "docs.html DRIFT".
      #
      # The gate was telling the truth: the tree really was drifted at that instant. A sibling step
      # in this same lane created the condition seconds earlier. It reproduces exactly — committed
      # tree green, inject -> check RED, inject -> rebuild -> check GREEN — and it fires whenever
      # the live asset count has moved since the last committed docs bake, i.e. most days. v1.28.1
      # published only because the numbers had not yet diverged.
      #
      # 🛑 THIS MAKES prepublishOnly's `build_docs --check` VACUOUS IN THIS LANE, BY CONSTRUCTION.
      # It now compares a file regenerated seconds earlier against a fresh regeneration and cannot
      # fail here. NEVER cite a green publish run as evidence that the docs were in sync. The
      # load-bearing instances are `deploy.yml` and the pre-push suite, which run against the
      # un-injected COMMITTED tree and still block real drift.
      #
      # Neither landing/ nor docs-src/ is in `files[]` (dist, README.md, LICENSE, logo.png,
      # server.json, smithery.yaml), so this restores self-consistency without touching what ships.
      # The real generator fix would be scoping the injector to a target set; see
      # OPS-PUBLISH-LANE-PRE-VERIFY-W{NEXT}.
      - name: Rebuild generated docs after injection (keeps prepublishOnly self-consistent)
        run: node scripts/build_docs.mjs

      # OIDC trusted publishing: NO `NODE_AUTH_TOKEN` here — a present token makes npm skip the
      # OIDC exchange (see the Phase-1 design-flaw note in the header). With no token, npm
      # authenticates via OIDC against the verified trusted-publisher config, and `--provenance`
      # auto-generates. (The NPM_TOKEN secret has been revoked + deleted; OIDC is the only path.)
      #
      # `if:` — OPS-DISTTAG-EVENTUAL-CONSISTENCY-W1 CH2 R5. One input, one literal value, never a
      # general expression. On a tag push `inputs.mode` is empty, so the condition is true and the
      # release publishes. Only an explicit `mode: verify-only` dispatch skips it. npm refuses to
      # republish an existing version, so a verify-only run that reached this step would red, and
      # one that COULD publish would be a hole in the ancestor guard's purpose. `id: publish` feeds
      # `steps.publish.outcome`, which the next two steps read as the evidence of whether an
      # upload happened, rather than trusting a flag. Pinned by INVARIANT 5.
      - name: Publish to npm with provenance
        run: npm publish --provenance
        id: publish
        if: inputs.mode != 'verify-only'

      # PUBLISH_LANE_MODE / NPM_PUBLISH_PERFORMED — OPS-DISTTAG-EVENTUAL-CONSISTENCY-W1 CH2 R5.
      # Derived from what the publish step DID (`steps.publish.outcome`), never from the input alone.
      # The badge carries a conclusion, not a token, so this line is how anyone reading a green run
      # can tell a release from a verify-only dispatch. A verify-only green is weaker in two
      # independent ways: (1) the upload command never ran; (2) so `prepublishOnly`'s 38 segments
      # never ran either. That lifecycle is triggered only by the upload; `npm pack` does not run it.
      # 🛑 THIS STEP'S SCRIPT MUST NEVER CONTAIN THE LITERAL UPLOAD COMMAND TEXT. The invariant test's
      # parser identifies the publish step as the FIRST step whose run text matches it, so a mention
      # here would make this step "the publish step" and silently re-point INVARIANT 2–5.
      - name: Record the lane mode and whether this run uploaded
        env:
          LANE_MODE: ${{ inputs.mode || 'publish' }}
          UPLOAD_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          echo "PUBLISH_LANE_MODE=${LANE_MODE}"
          echo "publish step outcome: ${UPLOAD_OUTCOME:-n/a}"
          if [ "${UPLOAD_OUTCOME}" = success ]; then
            echo "NPM_PUBLISH_PERFORMED=true"
          else
            echo "NPM_PUBLISH_PERFORMED=false"
          fi

      # ─── Verify dist-tag — OPS-DISTTAG-EVENTUAL-CONSISTENCY-W1 CH2 R4 ──────────────────────────
      #
      # WAIT OUT PROPAGATION, ON UNCACHED READS. The step this replaces read the CACHED packument 3×
      # at 20 s intervals and went red on every release from v1.28.0, each time AFTER npm had
      # accepted the upload, which also took the Smithery step below down with it every time.
      # Measured from the registry's own `time[v]`: since npm's publish-time malware scanning, a new
      # version does not EXIST at origin for 249–307 s after `npm publish` returns. No endpoint,
      # cached or not, can serve it sooner. So this step WAITS, polling every 15 s and stopping at the
      # first full match. It polls only the two endpoints measured as not served from cache,
      # through scripts/lib/npm-registry-read.mjs: dist-tags unbusted, and the version document
      # with a fresh ?cb= on each read. scripts/check-packument-read.mjs forbids the packument shape.
      #
      # 🛑 Waiting on a CACHED read stays forbidden: it outlasts a TTL instead of measuring the
      # thing. An error-swallowing step flag, a widened tolerance or a raised threshold are forbidden
      # outright (smithery-sync-lane.test.ts ASSERTION 4 already refuses the first).
      #
      # Emits, each on its own line (scripts/verify-npm-propagation.mjs):
      #   NPM_PROPAGATION_SECONDS=<n>|NOT_OBSERVED_WITHIN_<n>S  — the per-release evidence series
      #   NPM_VERSION_PUBLISHED=PASS|FAIL|INDETERMINATE        — the version document exists
      #   DIST_TAG_VERDICT=PASS|FAIL|INDETERMINATE             — dist-tags.latest == package.json version
      #   NPM_VERSION_REASON=<REASON>                          — only when there is one
      # Transport fails OPEN (INDETERMINATE, exit 0, ::warning::). Content fails CLOSED: a version npm
      # ACCEPTED but still will not serve at the deadline is FAIL, exit 1, because npm can hold one
      # for review. The message says accepted-not-refused and says to re-run with mode: verify-only,
      # never to re-publish.
      - name: Verify dist-tag
        env:
          # NPM_PROPAGATION_DEADLINE_S — measured 249-307 s over v1.28.1..v1.31.0 (2026-08-24..
          # 2026-09-23): 4 clean tag-run points, max 307 s (6 publishing runs incl. two dispatch reruns:
          # 249.0-307.6 s, origin time[v] minus the publish step's return). 1200 s is 3.9x that and
          # brackets the 12-16 min lags reported elsewhere. Re-tune from NPM_PROPAGATION_SECONDS,
          # never from taste. The script REFUSES (exit 1) if this is missing or not an integer.
          NPM_PROPAGATION_DEADLINE_S: '1200'
          NPM_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: node scripts/verify-npm-propagation.mjs

      # ─── OPS-SMITHERY-PUBLISH-LANE-W1 R3 — re-scan the Smithery listing, then VERIFY it ─────
      #
      # Smithery stores a SNAPSHOT of a server's tool list at publish time and never revisits it.
      # `algovault/crypto-quant-signal-mcp` was submitted 2026-04-10 and never republished, so for
      # five months a search-ranked listing advertised 3 tools and "across 5 perp venues" while the
      # origin served 8. A one-off republish only resets that clock. This step is the generator
      # fix: every tag that publishes a version also re-scans, and the lane fails closed.
      #
      # ── THE RACE THIS STEP'S FIRST PHASE EXISTS TO CLOSE ───────────────────────────────────
      #
      # `deploy.yml` triggers on `push: branches: [main]`; this workflow triggers on `push: tags`.
      # The release ritual lands FIRST and tags second, so the two run CONCURRENTLY — and this
      # lane (240 lines) finishes long before deploy.yml (1189 lines, docker build + SSH). A
      # re-scan fired at the end of the tag workflow would therefore scan the PREVIOUS build's
      # origin and write a stale snapshot carrying a FRESH timestamp, which is strictly worse than
      # the drift being repaired: it would look repaired and be wrong. So phase 1 polls the origin
      # until it reports the tag's own version, and reports INDETERMINATE rather than scanning
      # something it cannot vouch for.
      #
      # ── WHY TWO TOKENS ────────────────────────────────────────────────────────────────────
      #
      # The verification read is a PUBLIC endpoint, so it works with or without a credential —
      # deliberately, because a missing key must never suppress detection of real drift. But with
      # one token `exit 0` would encode both "we re-scanned and the listing agrees" and "we could
      # not re-scan and the stale listing happens to agree", which is exactly what the verdict-
      # token law forbids. A missing key would then ride silently on an unchanged tool set and
      # surface only at the next release that CHANGES tools — the worst possible moment. So the
      # step emits a second, independent line:
      #
      #   SMITHERY_SYNC_VERDICT=PASS|FAIL|INDETERMINATE   the CONTENT verdict
      #   SMITHERY_RESCAN=OK|SKIPPED_NO_CREDENTIAL|FAILED|NOT_ATTEMPTED   what the re-scan DID
      #
      # Both are printed AFTER the gate's own output, so `grep … | tail -1` always reads the
      # lane's authoritative state and never the gate's standalone NOT_ATTEMPTED placeholder. The
      # matrix below is `decideLaneOutcome()` in scripts/check-smithery-sync.mjs, where it is
      # asserted by a self-test that RUNS it — this YAML is not exercised pre-merge by anything.
      #
      # 🛑 NO `continue-on-error` ON THIS STEP, EVER. A sibling repo answered this exact API's
      # auth quirk with `continue-on-error: true`, and that surface then went stale in silence for
      # months — which is the failure mode this step exists to retire. A fail-open lever may
      # downgrade an exit code; it may never launder the token into a pass.
      #
      # 🛑 The secret is bound on THIS STEP ONLY, never at job level: a job-level `env:` would put
      # it in scope of the publish step, whose whole invariant is that it carries no token env.
      - name: Re-scan the Smithery listing and verify it against the live origin
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          # What the publish step actually did, so this step never claims an upload that did not
          # happen. In mode: verify-only it is `skipped` (OPS-DISTTAG-EVENTUAL-CONSISTENCY-W1 CH2,
          # honesty constraint R5).
          NPM_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -uo pipefail

          # SINGLE DERIVATION of the slug; the %2F form is computed, never a second literal.
          QUALIFIED='algovault/crypto-quant-signal-mcp'
          ENC="${QUALIFIED/\//%2F}"
          ORIGIN='https://api.algovault.com'
          # SINGLE DERIVATION of the target version: package.json, the same source `Verify dist-tag`
          # asserts (OPS-DISTTAG-EVENTUAL-CONSISTENCY-W1 CH2 R6). The ref name is `main` on a
          # dispatch, so deriving it from the tag made this leg wait 15 min for a version called
          # "main" and report NOT_ATTEMPTED on every non-tag run, a dark step. On a tag push the
          # tag is still cross-checked, and a disagreement is surfaced rather than followed.
          TARGET_VERSION="$(jq -r .version package.json)"
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            TAG_REF="${GITHUB_REF_NAME}"
            if [ "${TAG_REF#v}" != "${TARGET_VERSION}" ]; then
              echo "::warning::tag ${TAG_REF} disagrees with package.json version ${TARGET_VERSION}; the readiness poll and the re-scan follow package.json"
            fi
          fi
          RESCAN=NOT_ATTEMPTED
          if [ "${NPM_PUBLISH_OUTCOME:-}" = success ]; then
            UPLOAD_NOTE='The npm publish above SUCCEEDED and is not affected.'
          else
            UPLOAD_NOTE='No npm publish ran in this run (mode: verify-only), so nothing on npm is affected.'
          fi
          # A GitHub re-run replays the ORIGINAL event, so re-running a tag-push run would attempt the
          # upload again (npm refuses an existing version). Re-verification is a NEW dispatch.
          REVERIFY='start a NEW dispatch with mode: verify-only (gh workflow run publish-npm.yml --ref main -f mode=verify-only); the Re-run button replays the tag push and would attempt the upload again'

          # ── phase 1 — readiness poll (closes the deploy.yml race described above) ──────────
          echo "waiting for $ORIGIN/health to report ${TARGET_VERSION} — deploy.yml runs concurrently"
          READY=no
          for i in $(seq 1 45); do
            LIVE=$(curl -sS --max-time 15 "$ORIGIN/health" 2>/dev/null | jq -r '.version // empty' 2>/dev/null)
            if [ "${LIVE:-}" = "$TARGET_VERSION" ]; then
              READY=yes
              echo "origin reports ${LIVE} after $(( (i - 1) * 20 ))s — safe to scan"
              break
            fi
            echo "attempt ${i}/45: origin reports '${LIVE:-unreachable}', want ${TARGET_VERSION}"
            sleep 20
          done

          if [ "$READY" != yes ]; then
            echo "::warning::the origin never reported ${TARGET_VERSION} within 15 minutes, so the re-scan was NOT fired — scanning now would snapshot the PREVIOUS build under a fresh timestamp, which is worse than the drift it repairs. ${UPLOAD_NOTE} Once deploy.yml has finished, ${REVERIFY}."
            echo "SMITHERY_RESCAN=NOT_ATTEMPTED"
            echo "SMITHERY_SYNC_VERDICT=INDETERMINATE"
            exit 0
          fi

          # ── phase 2 — the re-scan ─────────────────────────────────────────────────────────
          # `PUT /servers/{q}/releases` is multipart with ONE field for an external server:
          # payload = {"type":"external","upstreamUrl":"…"}. Confirmed against both published CLI
          # bundles and measured live (202 + deploymentId + status WORKING → SUCCESS).
          if [ -z "${SMITHERY_API_KEY:-}" ]; then
            RESCAN=SKIPPED_NO_CREDENTIAL
            echo "::warning::SMITHERY_API_KEY is not set, so the listing was NOT re-scanned. The verification below still runs — the listing read needs no credential — so real drift is still DETECTED; what is lost is the recovery, not the detection."
          else
            # The key goes in a 600-mode curl config, never in argv: a bearer on a command line is
            # visible to `ps` and to any `set -x` a later edit might add.
            CURL_CFG=$(mktemp)
            chmod 600 "$CURL_CFG"
            printf 'header = "Authorization: Bearer %s"\n' "$SMITHERY_API_KEY" > "$CURL_CFG"
            trap 'rm -f "$CURL_CFG"' EXIT

            HTTP=$(curl -sS --config "$CURL_CFG" -o /tmp/smithery_rescan.json -w '%{http_code}' \
              -X PUT "https://api.smithery.ai/servers/${ENC}/releases" \
              -F "payload={\"type\":\"external\",\"upstreamUrl\":\"${ORIGIN}/mcp\"}" 2>/dev/null)

            if [ "${HTTP:-000}" != 202 ] && [ "${HTTP:-000}" != 200 ]; then
              RESCAN=FAILED
              echo "::error::the Smithery re-scan was refused: HTTP ${HTTP:-000}"
              head -c 2000 /tmp/smithery_rescan.json || true
            else
              DEPLOY_ID=$(jq -r '.deploymentId // empty' /tmp/smithery_rescan.json)
              echo "re-scan accepted: deploymentId=${DEPLOY_ID:-<none>}"
              RESCAN=FAILED
              # The CLI's exit code is NOT a verdict — in non-TTY it returns PENDING immediately
              # and forks a detached watcher. Poll the deployment to a terminal status ourselves.
              for i in $(seq 1 60); do
                STATUS=$(curl -sS --config "$CURL_CFG" --max-time 15 \
                  "https://api.smithery.ai/servers/${ENC}/releases/${DEPLOY_ID}" 2>/dev/null \
                  | jq -r '.status // empty' 2>/dev/null)
                echo "deployment ${DEPLOY_ID} status: ${STATUS:-unreachable}"
                case "${STATUS:-}" in
                  SUCCESS) RESCAN=OK; break ;;
                  FAILED|ERROR|CANCELLED)
                    echo "::error::the Smithery re-scan reached terminal status ${STATUS}"
                    break ;;
                esac
                sleep 5
              done
            fi
            rm -f "$CURL_CFG"
            trap - EXIT
          fi

          # ── phase 3 — verify, and branch on the TOKENS, never on an exit code ─────────────
          node scripts/check-smithery-sync.mjs 2>&1 | tee /tmp/smithery_sync.log
          SYNC=$(grep -oE 'SMITHERY_SYNC_VERDICT=[A-Z_]+' /tmp/smithery_sync.log | tail -1 | cut -d= -f2)

          echo "SMITHERY_RESCAN=${RESCAN}"
          echo "SMITHERY_SYNC_VERDICT=${SYNC:-NO_TOKEN_EMITTED}"

          case "${SYNC:-}" in
            FAIL)
              echo "::error::the Smithery listing does not match the live origin — see the divergence named above. ${UPLOAD_NOTE} This step fails so the catalogue drift is not silently inherited by the next release."
              exit 1 ;;
            INDETERMINATE)
              echo "::warning::the sync gate could not verify the listing (origin or Smithery unreachable) — this is not a divergence signal. ${UPLOAD_NOTE}"
              exit 0 ;;
            PASS)
              case "${RESCAN}" in
                OK)
                  echo "the Smithery listing was re-scanned and matches the live origin"
                  exit 0 ;;
                SKIPPED_NO_CREDENTIAL|NOT_ATTEMPTED)
                  echo "::warning::the listing matches the live origin, but NO re-scan was performed (SMITHERY_RESCAN=${RESCAN}) — it is correct by luck, not by verification. Restore SMITHERY_API_KEY before the next release that changes the tool set."
                  exit 0 ;;
                *)
                  echo "::error::the re-scan was ATTEMPTED and did not succeed (SMITHERY_RESCAN=${RESCAN}). The listing happens to agree today, which does not make a broken re-scan acceptable — the next tool change would ship undetected."
                  exit 1 ;;
              esac ;;
            *)
              echo "::error::the sync gate emitted no verdict token (${SYNC:-NO_TOKEN_EMITTED}). A gate that dies token-less is never a pass."
              exit 1 ;;
          esac
