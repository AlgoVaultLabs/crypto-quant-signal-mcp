name: Monitoring schedule boundary

# OPS-MONITORING-SCHEDULE-SOT-W1.
#
# WHY THIS WORKFLOW EXISTS AT ALL, rather than the gate living only in deploy.yml.
#
# deploy.yml is the ONLY push-on-main workflow in this repo, and it carries
# `paths-ignore: ops/monitoring/**` — deliberately, so that editing a host-side
# monitoring artifact does not rebuild the image and restart prod. GitHub skips a
# run only when EVERY changed file matches paths-ignore, so a commit touching ONLY
# `ops/monitoring/monitoring-inventory.json` runs NO workflow at all.
#
# That is exactly the commit shape this gate exists to police. Wired solely into
# deploy.yml it would have been structurally DARK for its primary corpus: green on
# every mixed commit, absent on every monitoring-only one — the "installed is not
# working" class CLAUDE.md records four prior instances of.
#
# So the gate is wired in BOTH places. Here, on the monitoring paths, it runs alone:
# no build, no image, no SSH, no deploy — a static lint over committed JSON. In
# deploy.yml it runs as one more fail-closed gate for commits that touch src/.
#
# It is deliberately NOT a `pre-push` hook block. That hook already carries five
# guarded blocks, and installing a sixth is the action that deadlocked ~70 checkouts
# twice inside 27 hours. If a later wave concludes it must be a hook block, that is
# OPS-MONITORING-SCHEDULE-HOOK-W{NEXT} and it goes through scripts/lib/hook-block.sh
# + hook_block_assert_publishable.

on:
  push:
    branches: [main]
    paths:
      - 'ops/monitoring/monitoring-inventory.json'
      - 'ops/monitoring/schedule-boundary-rule.json'
      - 'audits/monitoring-schedule-baseline.json'
      - 'scripts/check-monitoring-schedules.mjs'
      - '.github/workflows/monitoring-schedules.yml'
  pull_request:
    paths:
      - 'ops/monitoring/monitoring-inventory.json'
      - 'ops/monitoring/schedule-boundary-rule.json'
      - 'audits/monitoring-schedule-baseline.json'
      - 'scripts/check-monitoring-schedules.mjs'
  workflow_dispatch:

# ─── CONCURRENCY — OPS-SERIALIZE-LANDING-AND-DEPLOY-W1 CH3 ───────────────────────────────────
#
# THE GROUP KEY IS A FUNCTION OF THE RESOURCE, NEVER OF THE CONTAINER. That is this repo's
# existing freshness law ("a freshness key is a function of what it verifies, never of the
# container holding it") reappearing in a new domain. This workflow mutates NOTHING — its own header above says it plainly: no build, no image, no
# SSH, no deploy, a static lint over committed JSON. So the group buys run-lane dedup only, and
# the registry records `contended_target: none` rather than inventing one. It is grouped ANYWAY
# because the enumeration clause is what makes a 7th workflow unable to land unserialized; an
# exempt workflow is a hole in exactly the rule this wave installs.
#
# `queue: max`, never the `single` default: waves cite run IDs as acceptance evidence, and a run
# cancelled while PENDING is not a failure anywhere — it is simply missing. `max` lets every run
# survive to a verdict. Proven ACCEPTED and MEASURED on a throwaway branch before any rollout
# (run 32396494418 validated and ran; two further runs dispatched into the same group both stayed
# `pending` rather than the earlier one being cancelled, which is `max` behaving as documented and
# is what the `single` default would NOT have done).
#
# The knob that governs PENDING runs is `queue`. The OTHER one is deliberately absent everywhere
# in this repo: it scopes to the in-progress run, its `false` value appears nowhere in GitHub's
# documentation, and combining it with `queue: max` is an explicit workflow validation error.
#
# Group names are CASE-INSENSITIVE per the docs — never rely on case to distinguish two groups.
#
# No job-level concurrency block: GitHub does not document how workflow-level and job-level
# groups interact, and a load-bearing safety property must never be rented from undocumented
# behaviour. Declared in ops/shared-worktree-state.json (`ci-workflow-monitoring-schedules`) and asserted in BOTH
# directions by scripts/check-shared-state.mjs + tests/unit/workflow-concurrency.test.ts.
concurrency:
  group: ${{ github.workflow }}
  queue: max


permissions:
  contents: read

jobs:
  schedule-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Self-test FIRST and separately: a gate whose own logic is broken must never
      # be allowed to report on the corpus. Callers gate on the TOKEN, not the code.
      - name: Off-:00 schedule boundary gate (fail-closed)
        run: |
          node scripts/check-monitoring-schedules.mjs --self-test
          node scripts/check-monitoring-schedules.mjs
