      # OPS-RUNTIME-NODE24-W1 Ch4 — the generator for SEC-15. That finding existed because a
      # base image aged out of support with EVERY GATE GREEN: Node 20 hit EOL 2026-04-30 and
      # the Dockerfiles kept saying node:20-alpine for another 91 days, because "supported
