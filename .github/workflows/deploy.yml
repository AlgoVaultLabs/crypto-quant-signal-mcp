name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths-ignore:
      - 'activation-funnel/snapshots/**'
      - 'activation-funnel/README.md'
      - 'ops/systemd/**'
      # X402-CDP-BAZAAR-DISCOVERY-W1: host-side monitoring canaries (installed to
      # /opt/algovault-monitoring/ via SSH, NOT shipped in the container image) —
      # editing them must not trigger a prod image rebuild/restart.
      - 'ops/monitoring/**'
      # OPS-HETZNER-DISK-RECLAIM-W1: read-only disk-forensics tooling installed to
      # /opt/algovault-monitoring/ via SSH; NOT COPYed by the Dockerfile (verified)
      # and never read at runtime — editing it must not rebuild/restart prod.
      - 'ops/scripts/**'
      # GEO-REGISTRY-RANK-P1-W1: registry-discovery metadata at repo root.
      # Neither is COPYed by the Dockerfile (not runtime); LICENSE still ships
      # in the npm tarball. Editing them must not rebuild/restart prod.
      - 'LICENSE'
      - 'glama.json'
      # OPS-CADDYFILE-BACKPORT-W1: host-level Caddy config — same class as
      # ops/systemd/** + ops/monitoring/** above. Applied to /etc/caddy/Caddyfile
      # via SSH + `systemctl reload caddy`; NOT COPYed by the Dockerfile and never
      # read at runtime, so editing it must not trigger a prod image
      # rebuild/restart. Route-parity stays gated by the pre-push node:test sweep
      # (tests/unit/caddy-route-parity.test.mjs) — this workflow's vitest step
      # never ran it, so ignoring the path costs no CI coverage.
      - 'Caddyfile'

# ─── CONCURRENCY — OPS-SERIALIZE-LANDING-AND-DEPLOY-W1 CH3 ───────────────────────────────────
#
# THE GROUP KEY IS A FUNCTION OF THE RESOURCE, NEVER OF THE CONTAINER. That is this repo's
# existing freshness law ("a freshness key is a function of what it verifies, never of the
# container holding it") reappearing in a new domain. One Hetzner host and one deploy path, so ONE global group: two deploys must never overlap on
# the box, and a per-ref key would let a tag build and a main build deploy at once.
#
# `queue: max`, never the `single` default: waves cite run IDs as acceptance evidence, and a run
# cancelled while PENDING is not a failure anywhere — it is simply missing. `max` lets every run
# survive to a verdict. Proven ACCEPTED and MEASURED on a throwaway branch before any rollout
# (run 32396494418 validated and ran; two further runs dispatched into the same group both stayed
# `pending` rather than the earlier one being cancelled, which is `max` behaving as documented and
# is what the `single` default would NOT have done).
#
# The knob that governs PENDING runs is `queue`. The OTHER one is deliberately absent everywhere
# in this repo: it scopes to the in-progress run, its `false` value appears nowhere in GitHub's
# documentation, and combining it with `queue: max` is an explicit workflow validation error.
#
# Group names are CASE-INSENSITIVE per the docs — never rely on case to distinguish two groups.
#
# No job-level concurrency block: GitHub does not document how workflow-level and job-level
# groups interact, and a load-bearing safety property must never be rented from undocumented
# behaviour. Declared in ops/shared-worktree-state.json (`ci-workflow-deploy`) and asserted in BOTH
# directions by scripts/check-shared-state.mjs + tests/unit/workflow-concurrency.test.ts.
concurrency:
  group: ${{ github.workflow }}
  queue: max


jobs:
  deploy:
    # OPS-SUITE-VERDICT-REPORTER-CHANNEL-W1 CH2 — a CEILING, not a budget.
    #
    # Measured 2026-08-22 with `gh api repos/AlgoVaultLabs/crypto-quant-signal-mcp/actions/runs/
    # {id}/jobs` over the 20 most recent SUCCESSFUL `deploy` jobs on main:
    #   n=20  min=198s  p50=257s  p95=335s  p99=335s  MAX=339s (5.7 min)
    # 20 minutes is 3.54x that observed max. That is the instrument and the number together — a
    # baseline without its instrument is meaningless, and this one must never be compared against
    # a figure taken any other way.
    #
    # Chosen to be well clear of a healthy run and still tight enough to kill a hang: the job had
    # NO ceiling at all before this, so a wedged step ran to GitHub's 6-hour default while every
    # concurrent session's deploy queued behind it.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # ── Pre-deploy gate: catches landing-page drift BEFORE SSH-deploy ──
      # WELCOME-EMAIL-W1 fix-forward (2026-04-28): the original plan called for
      # the build_landing.mjs --check guard to run via `docker exec` post-deploy,
      # but the prod Dockerfile doesn't ship `scripts/` or `landing/docs.html`
      # (Caddy serves the latter from /var/www/algovault/, not the container).
      # Running --check on the GHA runner here blocks bad pushes BEFORE they
      # reach Hetzner — strictly better than post-deploy detection.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # OPS-RUNTIME-NODE24-W1: track the runtime (Node 20 EOL 2026-04-30)
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Compile TS (produces dist/lib/signup-flow.js for the guard)
        run: npm run build

      # KNOWLEDGE-ARTIFACT-W1 (2026-05-18): mirror the Docker Stage 1
      # `RUN npm run build:knowledge` on the GHA runner so a broken generator
      # fails BEFORE the SSH-deploy step (matching the build_landing --check
      # pattern below). The runner-side output is NOT used by the deployed
      # image — Dockerfile Stage 1 re-runs the generator inside the build
      # context on Hetzner. This is a fail-fast gate, not a deployment input.
      - name: Knowledge bundle generator (pre-deploy fail-fast)
        run: npm run build:knowledge

      # OPS-VITEST-SUITE-REPAIR-W1 (2026-07-04): full vitest suite as a pre-deploy
      # gate. Until now the suite was gated ONLY by the local pre-push hook
      # (scripts/check_test_baseline.sh) — which had been warn-overridden — so a red
      # suite (e.g. the cross-asset-grid 42-cell-refresh timeouts) could reach prod
      # via a no-test deploy. deps + dist are already installed/built above; SQLite
      # backend (no DATABASE_URL) mirrors the pre-push gate. A failure here fails the
      # job BEFORE the SSH-deploy step below, blocking the deploy.
      - name: Vitest suite (pre-deploy gate)
        run: |
          # Pre-create the shared local SQLite DB by running ONE DB-touching suite in a
          # single worker first, so the parallel run never races the first fresh-DB open
          # (funnel-snapshot et al. otherwise flake on a cold DB). Best-effort (|| true).
          # NB: the pre-warm target MUST be a suite that still writes the SHARED DB.
          # analytics-external-only stopped qualifying at OPS-ANALYTICS-EXT-PARALLEL-FLAKE-W1,
          # and funnel-snapshot stopped at OPS-PARALLEL-SESSION-CAPACITY-W2 Ch3 — both now
          # point at their OWN temp DB via PERFORMANCE_DB_PATH, so running either here would
          # warm a temp dir and warm NOTHING, silently reopening the cold-open race for every
          # remaining suite. agent-session-source-stamp writes the shared DB and passes alone.
          # If it is ever isolated too, re-point again; the check is a `grep -L
          # PERFORMANCE_DB_PATH` over the suites importing performance-db.
          npx vitest run tests/agent-session-source-stamp.test.ts >/dev/null 2>&1 || true
          # OPS-DEPLOY-PROVENANCE-AND-VERDICT-CLASS-W1 CH2d: vitest no longer DECIDES here. It
          # writes a machine-readable report and the classifier in the next step renders the
          # verdict, because vitest's exit 1 encodes BOTH "verified, broken" and "could not verify
          # in time" — and on 2026-08-17 that ambiguity blocked a finished, merged wave for ~3
          # days. `|| true` moves the decision one step later; it does NOT relax it. The classifier
          # blocks on FAIL *and* on INDETERMINATE, and a crashed vitest that writes no report is
          # INDETERMINATE, which also blocks.
          # OPS-SUITE-VERDICT-REPORTER-CHANNEL-W1 CH1: the error-shape reporter is registered HERE,
          # on the command line, and NOT in vitest.config.ts. Measured on vitest 3.2.4: a CLI
          # `--reporter` flag REPLACES `test.reporters[]` from the config rather than appending to
          # it — so a reporter registered only in the config would never run under this very
          # invocation. It would be green locally, green in its self-test, and dark on the one
          # runner that gates the deploy: the exact defect class this wave exists to retire.
          # The JSON report is still written, byte-for-byte as before; the sidecar is additive.
          npx vitest run --reporter=default --reporter=json --outputFile=.vitest-report.json \
            --reporter=./scripts/vitest-error-shape-reporter.mjs || true

      # The verdict, not the exit code. PASS / PASS_AFTER_ISOLATION deploy; FAIL and INDETERMINATE
      # both block, and stay DISTINCT so an operator (and CH4's blame classifier) can tell a
      # regression from an unfinished measurement.
      - name: Classify the suite verdict (a timeout is not a regression)
        id: suite_verdict
        run: |
          set +e
          # `--sidecar=` is the CALLER DECLARING it expects the structured channel. It is never
          # inferred: a local `npm test` writes no sidecar (the reporter is CI-registered only), so
          # inferring expectation would false-INDETERMINATE locally, and inferring the other way
          # would let CI degrade silently to the string channel while reporting green. Declared and
          # unusable ⇒ INDETERMINATE ⇒ deploy blocked, loudly.
          #
          # LANDING COMMIT 2 of 2. Commit 1 shipped the producer consumed by nothing; run
          # 32557946437 (sha 44092c3) then proved on the real runner that the reporter emits a
          # well-formed sidecar and that CI retains it. This flip reads what that run produced.
          node scripts/classify-suite-verdict.mjs .vitest-report.json \
            --sidecar=.vitest-error-shapes.json | tee /tmp/suite-verdict.txt
          V=$(grep '^SUITE_VERDICT=' /tmp/suite-verdict.txt | tail -1 | cut -d= -f2)
          [ -n "$V" ] || V=INDETERMINATE
          echo "verdict=$V" >> "$GITHUB_OUTPUT"
          {
            echo "### Suite verdict: \`$V\`"
            echo ''
            echo '```'
            cat /tmp/suite-verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$V" in
            PASS|PASS_AFTER_ISOLATION) echo "deploy permitted on $V"; exit 0 ;;
            *) echo "deploy BLOCKED on $V"; exit 1 ;;
          esac

      # DOCS-GENERATOR-FROM-NAV-SOT-W1 CH5: docs.html structural drift canary. Fails the push if the
      # docs sidebar / body / anchors have fallen out of sync with the ONE outline SoT
      # (src/lib/docs-outline.ts ← nav publicToolEntries + channel-registry), the Tools/Channels counts
      # diverge from the registries, or a partial is missing. Network-free (imports the dist built above).
      # Runs BEFORE build_landing --check (which fills the connect-surface + signup-flow markers build_docs
      # emits empty). Makes docs drift + silent section omission structurally impossible.
      # OPS-SUITE-VERDICT-REPORTER-CHANNEL-W1 CH1: RETAIN the evidence. Until now the CI suite
      # report was written, read once and discarded, so a post-hoc question about a red — which
      # tests were slow, what shape a failure actually had — could only be answered by re-running.
      # `if: always()` so a FAIL/INDETERMINATE run, the case you most need the artifact for, still
      # uploads it.
      - name: Upload suite report + error shapes (forensics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-suite-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .vitest-report.json
            .vitest-error-shapes.json
          retention-days: 30
          if-no-files-found: warn
          # BOTH paths begin with a dot, and actions/upload-artifact@v4 treats a dotfile as HIDDEN
          # and EXCLUDES it by default. Measured on run 32557412979: the step logged
          # `include-hidden-files: false` and then "No files were found with the provided path",
          # while the classifier in the step before had just read .vitest-report.json successfully —
          # so the files were there and the uploader skipped them. Nothing but a real CI run shows
          # this: the paths are correct, the YAML is correct, and it fails silently at `warn`.
          include-hidden-files: true

      # OPS-SUITE-VERDICT-REPORTER-CHANNEL-W1 CH2 — THE FLOOR PROOF.
      #
      # Runs the REAL classifier invocation against the CAPTURED forced-timeout fixture, on the
      # real runner, and asserts BOTH the emitted token AND the gate's response to it. That proves
      # the channel, the classifier and the gating decision here, every run, without ever landing a
      # knowingly-broken test on main to manufacture a live timeout.
      #
      # HONEST SCOPE, and it is not softened: this proves the channel, the classifier and the
      # gate's response on the real runner. It does NOT prove all four links firing SIMULTANEOUSLY
      # in one live run. That observation is deferred to the next naturally-occurring timeout on
      # main, and is owned by OPS-VERDICT-PIPELINE-E2E-PROOF-W1 as a CAPTURE task.
      - name: Verdict-channel floor proof (captured timeout must read INDETERMINATE, and BLOCK)
        run: |
          set +e
          out=$(node scripts/classify-suite-verdict.mjs \
            tests/fixtures/verdict-channel/timeout-only.report.json \
            --sidecar=tests/fixtures/verdict-channel/timeout-only.shapes.json \
            --no-retry 2>&1)
          rc=$?
          printf '%s\n' "$out"
          V=$(printf '%s\n' "$out" | grep '^SUITE_VERDICT=' | tail -1 | cut -d= -f2)
          if [ "$V" != "INDETERMINATE" ]; then
            echo "FLOOR FAIL: a captured REAL timeout classified '$V', expected INDETERMINATE."
            echo "  That is the dark-gate defect this wave removed, back again."
            exit 1
          fi
          if [ "$rc" -ne 3 ]; then
            echo "FLOOR FAIL: token was INDETERMINATE but exit was $rc, expected 3."
            echo "  The token->exit mapping is what callers other than this workflow gate on."
            exit 1
          fi
          # The GATE's own response to that token, evaluated with the same case arms the real
          # verdict step uses. Asserting the token alone would leave the decision unproven.
          case "$V" in
            PASS|PASS_AFTER_ISOLATION) echo "FLOOR FAIL: the gate would PERMIT a deploy on '$V'"; exit 1 ;;
          esac
          echo "FLOOR OK: token=$V exit=$rc -> deploy correctly BLOCKED on a contention-shaped red."

      - name: Docs structural drift canary (build_docs --check)
        run: node scripts/build_docs.mjs --check

      # AUTH-THREE-STATE-W1 CH3 — credential-outcome conformance. Four not-found paths once
      # returned a byte-identical `{tier:'free', key:null}`, so a paying customer with a typo'd or
      # revoked key was served the anonymous free tier at HTTP 200 with no way to tell. CH1-CH3
      # made the states distinguishable; this is what makes writing the collapse again a BUILD
      # failure rather than a code-review catch. Emits CREDENTIAL_OUTCOME_VERDICT and fails CLOSED
      # (INDETERMINATE = exit 3) on an unreadable or empty corpus. --self-test runs FIRST, so a
      # gate that has lost its teeth cannot green the build.
      - name: Credential-outcome conformance gate (fail-closed)
        run: |
          node scripts/check-credential-outcome-conformance.mjs --self-test
          node scripts/check-credential-outcome-conformance.mjs

      # build_landing --check also covers build_tools_page + build_channel_pages (both invoked by
      # build:landing) — the /tools index + the 3 channel hub pages (/mcp /rest-api /webhooks) stay
      # in sync with their SoTs (NAV-PLATFORM-GENERATOR-W1 + CHANNEL-HUB-PAGES-GEO-W1).
      - name: Landing-page sync guard (build_landing --check; incl. tools + channel pages)
        run: node scripts/build_landing.mjs --check

      # OPS-LANDING-ASSET-CACHE-BUST-W1: first-party landing JS must carry its content hash
      # (`?v=<sha256[:8]>`). Caddy serves assets max-age=60 but CLOUDFLARE rewrites that to
      # max-age=14400 (4h), so a correct deploy stays invisible to returning visitors for up
      # to 4h — and because track-record-proxy.js refreshes on an interval, the stale copy
      # ACTIVELY re-writes hydrated spans back to the old value (that is how /verify kept
      # showing merkle batch "#100" against an on-chain "#102" after a correct deploy).
      # Failing here makes "changed the JS, forgot to re-stamp" a build failure instead of a
      # silent 4h regression that also defeats post-deploy visual verification.
      - name: Landing asset cache-bust guard (build_asset_versions --check)
        run: node scripts/build_asset_versions.mjs --check

      # NAV-PLATFORM-GENERATOR-W1 CH5: unified-nav drift canary (STATIC parity). Fails the push
      # if any landing page's injected nav region has fallen out of sync with the ONE model
      # (src/lib/site-nav.ts renderSiteNav() ← nav-manifest.ts) OR a nav-bearing page is missing
      # the <!-- NAV:START/END --> markers (a new page that forgot the region). Network-free
      # (imports the dist built above). Makes "the mobile menu drifted" and "we missed page N"
      # structurally impossible.
      - name: Nav sync + coverage guard (build_nav --check)
        run: node scripts/build_nav.mjs --check

      # OPS-AUDIT-REMEDIATION-HIGH-W1 Ch5 (SEC-36): the mobile-nav parity invariant was committed
      # but executed by nothing — build_nav.mjs referenced it only inside a COMMENT, so "a desktop
      # nav shipped without its mobile replacement" was never actually gated. It runs here, next to
      # the nav guard whose invariant it completes.
      - name: Mobile-nav parity canary (check_mobile_nav_parity.sh)
        run: bash scripts/check_mobile_nav_parity.sh

      # OPS-ANALYTICS-TAG-SINGLE-SOURCE-W1 CH4 — every content landing page must carry the
      # single-source analytics region (src/lib/analytics-snippet.ts) in sync + total coverage.
      # Fails the push if any page drifted or a new page never got the tag (structural).
      - name: Analytics tag drift canary (build_analytics --check)
        run: node scripts/build_analytics.mjs --check

      # FEATURE-REGISTRY-SOT-W1 CH4: registry drift canary (STATIC parity). Fails the
      # push BEFORE SSH-deploy if any channel's surface (server.tool registration set /
      # x402 TOOL_PRICING derive / gated route set / capabilities projection) has fallen
      # out of sync with the feature registry SoT (src/lib/feature-registry.ts). Network-
      # free (imports the dist built above). The LIVE half runs as a weekly host cron.
      - name: Feature-registry drift canary (check-feature-registry-drift --check)
        run: node scripts/check-feature-registry-drift.mjs --check

      - name: Integrations registry lockstep canary (check-integrations-registry-lockstep --check)
        run: node scripts/check-integrations-registry-lockstep.mjs --check

      # FOOTER-CONTACT-AND-UNIVERSAL-COVERAGE-W1 — brand-footer universal coverage.
      # Asserts every non-exempt public page carries the footer rendered from the ONE SoT
      # (src/lib/footer-content.ts). Fail-closed; prints FOOTER_INJECT_VERDICT=.
      #
      # WHY THIS STEP EXISTS AT ALL: until this wave `inject-footer.mjs --check` was invoked by
      # NOTHING — not package.json, not a workflow, not ops/ — while its own docblock called it a
      # CI canary and a unit test said it "paired with" it. That is why its hand-maintained target
      # list went stale TWICE (it listed 12 of 24 integrations pages) with every gate green.
      # The meta-canary could not catch it either: check-canaries-wired.mjs discovers gates by
      # NAME (scripts/check-*, check_*, *canary*), and this file matches none of those patterns.
      - name: Brand-footer universal-coverage canary (fail-closed)
        run: |
          node scripts/inject-footer.mjs --self-test
          node scripts/inject-footer.mjs --check

      # DESIGN-WELCOME-LAYOUT-AND-FOOTER-FLOW-W1 — footer must render BELOW page content.
      # The coverage canary above proves the footer is PRESENT and matches the SoT. Present and
      # correctly PLACED are different claims, and only the first was checked: three pages
      # (/welcome, /contact, /signup) shipped with a centering flex-row body that made the footer
      # a flex ITEM beside the card. Design.md section 9 already required probing body styles
      # before injecting footer chrome; this encodes that rule as a gate instead of prose.
      - name: Footer body-flow canary (fail-closed)
        run: |
          node scripts/check-footer-body-flow.mjs --self-test
          node scripts/check-footer-body-flow.mjs

      # DESIGN-ACCOUNT-THEME-TOKENS-W1 — design tokens must actually RESOLVE, per host.
      # Every consumed custom property must resolve from the page OR from a stylesheet the page
      # links AND that page's CSP permits on that host; plus the inverse, that every linked
      # stylesheet is CSP-permitted. Evaluated on BOTH origins, because the same page with the
      # same CSP resolves differently on the apex (stylesheet is 'self') than on api (it is
      # cross-origin) — /account rendered white on api while being correct on the apex, and a
      # single-host gate would have called it green. A gate that only asks "is this token defined
      # somewhere" also passes that page: the token WAS defined, the CSP just refused the file.
      - name: Design-token resolution canary (fail-closed)
        run: |
          node scripts/check-token-resolution.mjs --self-test
          node scripts/check-token-resolution.mjs

      # LANDING-MCP-CLIENT-REGISTRY-W1 CH5 — the vendor-UI-path drift gate. The
      # lockstep canary above proves a SLUG is wired across its six homes; this one
      # proves the COPY is not stale. Claude Desktop renamed Settings → Integrations
      # to Settings → Connectors, and three public surfaces kept naming the dead menu
      # for months with every gate green, because nothing was watching the words.
      # Fail-closed: an unreadable corpus or an unloadable registry is INDETERMINATE
      # (exit 3), never a pass. Deliberately NOT a 6th shared pre-push block —
      # installing one there took every parallel session down twice in 27 hours.
      # CROSS-REPO-TUTORIAL-PRODUCER-GATE-W1: this step now also enforces
      # ops/brand-forbidden-phrases.json — the CANONICAL forbidden-phrase blocklist,
      # vendored into algovault-skills with a .sha256 and gated there too. It stores a
      # PATTERN, not a literal list, so a future "25 calls/day" is caught by the class
      # rather than sailing through because nobody added it to an enumeration.
      - name: MCP-client copy drift gate + brand-forbidden-phrases blocklist (fail-closed)
        run: |
          node scripts/check-mcp-client-copy.mjs --self-test
          node scripts/check-mcp-client-copy.mjs

      # SCAN-RANKBY-W1 CH2: cross-venue rank-field parity canary (STATIC). Fails the
      # push if a venue stops returning a rank field, the funding APR unit drifts, or
      # /capabilities stops advertising the rankBy lens set. Network-free (fixture-
      # injected via the rank-metrics seam). The LIVE half runs as a weekly host cron.
      - name: Rank-metrics parity canary (check-rank-metrics-parity --check)
        run: node scripts/check-rank-metrics-parity.mjs --check

      # SCAN-DIGEST-MCP-PARITY-W1 CH4: single-derivation canary (STATIC). Fails the push
      # the moment a channel forks the scan digest — asserts renderScanDigestLine matches
      # the cross-repo locked contract (the bot pins the same line), the webhook scan_digest
      # calls[] are enrichScanCall output (passthrough), content[1] projects from the line
      # renderer, and enrichScanCall stays allow-listed. Network-free. Weekly --live host cron.
      - name: Scan-digest parity canary (check-scan-digest-parity --check)
        run: node scripts/check-scan-digest-parity.mjs --check

      # GEO-W1 C4: JSON-LD structural integrity test. Network-free unit tests
      # validate the SHAPE of JSON-LD blocks across landing/*.html (Product /
      # Organization / WebSite / Service / SoftwareApplication on every page;
      # FAQPage on /faq; DefinedTermSet on /glossary; no placeholder leakage;
      # no forbidden phrases per Build Rule 9). NOTE: numerical fields (PFE WR,
      # totalCalls, batchCount) are NOT byte-pinned because the cron-driven
      # live API drifts every few minutes; commit-time freshness is the
      # numerical refresh seam (developer runs `node scripts/generate_jsonld.mjs`
      # locally + commits). Unit tests catch structural regressions.
      - name: JSON-LD structural integrity (unit tests)
        run: node --test tests/unit/geo_jsonld_consistency.test.mjs tests/unit/geo_answer_page_invariants.test.mjs

      # ── OPS-AUDIT-REMEDIATION-CRITICAL-W1 — the two generator gates ────────────────
      # Both run BEFORE the SSH-deploy step and are FAIL-CLOSED (no `|| true`): a
      # committed credential or an unescaped URL param can no longer reach public main.
      # This wiring is the half that was missing — security-canary.mjs shipped in the
      # June audit but was invoked by nothing, which is why the leaked Postgres password
      # (SEC-02) sat in a PUBLIC repo for 7 weeks with every gate green.
      # Each script self-tests its own matcher first and exits non-zero if the detector
      # is broken, so neither can degrade into a silent always-pass.
      - name: Secret-scan gate (security-canary Gate B — fail-closed)
        run: |
          node scripts/security-canary.mjs --self-test
          node scripts/security-canary.mjs --check=pii

      - name: Landing escape-lint (URL param → innerHTML — fail-closed)
        run: |
          node scripts/check-landing-escaping.mjs --self-test
          node scripts/check-landing-escaping.mjs

      # OPS-DOCS-HOLDRATE-LIVE-W1 (SEC-12 + SEC-32) — the docs-surface analogue of
      # tests/unit/tool-description-forward-stability.test.ts. /docs published "~84%" while the SoT
      # was 99.2%; retyping the digit would have recreated the defect one release later. This blocks
      # the literal form coming back, plus the `%%` bug that shipped to the npm README twice and the
      # dead-hook shape where a data-tr-field span exists on a page that never loads the hydrator.
      - name: Live numeric-claims gate (fail-closed)
        run: |
          node scripts/check-live-numeric-claims.mjs --self-test
          node scripts/check-live-numeric-claims.mjs

      # OPS-JSONLD-PFE-PROPERTYVALUE-MANAGE-W1 — the generator for the phrasing-escape class.
      # Three separate waves fixed "a new phrasing of the same fact escaped its phrasing-specific
      # claim regex" by adding one more row, which cannot retire the class. This asks the inverse
