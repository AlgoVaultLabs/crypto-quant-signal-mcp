name: Regenerate Landing from Manifests

# WEBSITE-REFRESH-W1 C8 — receives `repository_dispatch` from algovault-skills
# (or manual workflow_dispatch). Checks out both repos as siblings, runs the
# manifest-driven build script, commits regenerated surfaces if changed, and
# pushes — which triggers the standard deploy.yml on the same branch.
#
# Total round-trip from manifest edit to live algovault.com update: ~2 min.

on:
  repository_dispatch:
    types: [manifest-changed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Self-trigger on direct edits of manifests if cross-repo sync is bypassed.
      # NOTE: this path won't typically fire because manifests live in the sibling
      # repo, but listed for safety in case someone vendors the manifests here.
      - 'skills/manifest.json'
      - 'integrations/manifest.json'

# ─── CONCURRENCY — OPS-SERIALIZE-LANDING-AND-DEPLOY-W1 CH3 ───────────────────────────────────
#
# THE GROUP KEY IS A FUNCTION OF THE RESOURCE, NEVER OF THE CONTAINER. That is this repo's
# existing freshness law ("a freshness key is a function of what it verifies, never of the
# container holding it") reappearing in a new domain. One set of landing surfaces, so ONE global group. This is also the CI writer named in the
# `ref-main` residual: it commits and pushes to main with a PAT (specifically so the push
# re-triggers deploy.yml), which means CI can move main underneath a local session and no local
# lock can prevent it. Hardening that is OPS-CI-MAIN-WRITER-HARDEN-W{NEXT}.
#
# `queue: max`, never the `single` default: waves cite run IDs as acceptance evidence, and a run
# cancelled while PENDING is not a failure anywhere — it is simply missing. `max` lets every run
# survive to a verdict. Proven ACCEPTED and MEASURED on a throwaway branch before any rollout
# (run 32396494418 validated and ran; two further runs dispatched into the same group both stayed
# `pending` rather than the earlier one being cancelled, which is `max` behaving as documented and
# is what the `single` default would NOT have done).
#
# The knob that governs PENDING runs is `queue`. The OTHER one is deliberately absent everywhere
# in this repo: it scopes to the in-progress run, its `false` value appears nowhere in GitHub's
# documentation, and combining it with `queue: max` is an explicit workflow validation error.
#
# Group names are CASE-INSENSITIVE per the docs — never rely on case to distinguish two groups.
#
# No job-level concurrency block: GitHub does not document how workflow-level and job-level
# groups interact, and a load-bearing safety property must never be rented from undocumented
# behaviour. Declared in ops/shared-worktree-state.json (`ci-workflow-regenerate-landing`) and asserted in BOTH
# directions by scripts/check-shared-state.mjs + tests/unit/workflow-concurrency.test.ts.
concurrency:
  group: ${{ github.workflow }}
  queue: max


permissions:
  # Default GITHUB_TOKEN is read-only on contents (per GitHub 2023+ org defaults).
  # The "Commit regenerated surfaces" step needs write access to push back to main.
  # The push triggers deploy.yml on the same branch (with [skip ci] tag in the
  # commit message to prevent the regenerate job from re-running on its own
  # commit — though deploy.yml fires regardless because that workflow doesn't
  # respect skip-ci tags; deploy is exactly what we want as the side effect).
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout crypto-quant-signal-mcp
        uses: actions/checkout@v4
        with:
          # Use a PAT for the checkout so subsequent `git push` is authenticated
          # as a user (not GITHUB_TOKEN). Pushes by GITHUB_TOKEN do NOT trigger
          # downstream workflow runs (anti-loop default); pushes by a PAT DO
          # trigger them — we need deploy.yml to fire on the regenerated
          # landing/* commit so the new files reach /var/www/algovault.
          # Reuses the same MCP_REPO_DISPATCH_TOKEN PAT that algovault-skills
          # uses to fire the dispatch (one PAT, two purposes — naming is
          # awkward but cuts secret-management surface).
          token: ${{ secrets.MCP_REPO_DISPATCH_TOKEN }}
          fetch-depth: 0

      - name: Checkout algovault-skills (in-workspace subdir)
        uses: actions/checkout@v4
        with:
          repository: AlgoVaultLabs/algovault-skills
          # actions/checkout confines paths to the workspace dir, so a sibling
          # `../algovault-skills` is rejected. Check into ./algovault-skills/
          # instead; the build script's __dirname-relative path resolution
          # (../scripts → ../) works identically inside the in-workspace subdir.
          path: algovault-skills
          fetch-depth: 1

      - name: Run build script
        run: |
          node algovault-skills/scripts/build_landing.mjs --target .

      - name: Clean up sibling-checkout (so it doesn't get committed in next step)
        run: rm -rf algovault-skills

      - name: Commit regenerated surfaces (if any)
        env:
          DISPATCH_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_ACTOR: ${{ github.event.client_payload.source_actor }}
        # ─── COLLISION-SAFE PUSH — OPS-CI-MAIN-WRITER-HARDEN-W1 CH1 R1 ─────────────────────────
        #
        # This job is THE ONE writer of `main` that cannot take the landing lock. OPS-SERIALIZE-
        # LANDING-AND-DEPLOY-W1 made every LOCAL writer serialise through scripts/land.sh, whose
        # critical section contains the fetch, the rebase and the push. A GitHub runner cannot
        # participate in a mutex that lives on the operator's laptop, and no `concurrency` group
        # can make a CI job wait on one. So this writer takes the OTHER half of the invariant:
        # it TOLERATES LOSING THE RACE instead of taking the lock.
        #
        # The defect being retired, reproduced 2026-08-21 against this step's PREVIOUS script: a
        # local session lands a commit while this job is building, and the bare `git push` that
        # stood here failed `! [rejected] main -> main (fetch first)`, exited 1, and THE
        # REGENERATION WAS LOST — the remote kept only the other writer's commit. The
        # run goes red, and nothing was watching — 12 runs in 4 months, no `if: failure()` step,
        # and until this wave no monitoring row polled this workflow's conclusion at all.
        #
        # WHY THE COMMIT IS REBASED RATHER THAN THE BUILD RE-RUN (R1 requires this be stated):
        # the preceding step does `rm -rf algovault-skills`, so re-running the build inside a
        # retry loop would mean re-checking-out the sibling repo per attempt. It would also buy
        # nothing: the regenerated bytes are a PURE FUNCTION of skills/manifest.json and
        # integrations/manifest.json, which live in that sibling repo and cannot change during
        # this run. Rebasing the commit is therefore equivalent and simpler. It is safe by
        # construction on the content side too — build_landing.mjs writes ONLY the interiors of
        # its `<!-- BUILD:NAME -->` regions (measured: perturbing a manifest entry changed
        # exactly one line, inside the markers; `## What's new` sits outside them and is
        # structurally unreachable), and this workflow's own concurrency group is global, so a
        # second regeneration can never be editing those same regions concurrently.
        #
        # NEVER a force, NEVER a lease, NEVER an auto-resolve. A CI writer that settles a
        # collision by overwriting is a data-integrity defect wearing a fix's clothes. README.md
        # is the canonical npm-README SoT and is NOT purely derived, so `-X ours/theirs` could
        # destroy authored release copy. A conflict aborts and fails the run, with the paths.
        #
        # 3 attempts, matching scripts/land.sh's MAX_ATTEMPTS (land.sh:111) — deliberately the
        # same number, so both sides of the `ref-main` residual behave identically rather than
        # each carrying a locally-tuned constant. Backoff is jittered because the case being
        # retried IS contention; identical backoffs re-collide in lockstep.
        #
        # The 9th probe was asked and answered before this loop was written: the best-maintained
        # push action (stefanzweifel/git-auto-commit-action, 2.6k stars) documents this gap as
        # out of scope verbatim — "No support for `git rebase` or `git merge`" — and the one
        # action that does close it auto-resolves conflicts, which is the defect. GitHub's merge
        # queue is scoped to pull requests and this job pushes directly. There is no maintained
        # primitive to prefer, and handing a third-party action this job's PAT to save fifteen
        # lines of shell is not a trade worth making.
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.email "ci@algovault.com"
            git config user.name "AlgoVault CI"
            git add landing/skills.html landing/index.html landing/llms.txt landing/llms-full.txt README.md
            # NOTE: no `[skip ci]` tag — we WANT deploy.yml to fire on this
            # commit so the regenerated landing/* files reach /var/www/algovault.
            # Recursion is impossible because regenerate-landing.yml's `push`
            # filter is restricted to `skills/manifest.json` and
            # `integrations/manifest.json` paths (which live in the sibling repo,
            # not here) — so its own commits to landing/* never re-fire it.
            git commit -m "build(landing): regenerate from manifests" -m "Triggered by repository_dispatch from ${DISPATCH_REPO:-self} (sha ${DISPATCH_SHA:-n/a}, actor ${DISPATCH_ACTOR:-n/a})."

            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            MAX_ATTEMPTS=3
            attempt=0
            while [ "$attempt" -lt "$MAX_ATTEMPTS" ]; do
              attempt=$((attempt + 1))

              # Every attempt RE-FETCHES. A retry against a stale view of the remote is not a
              # retry — it is the same push again.
              if ! git fetch origin "$BRANCH"; then
                echo "::error::regenerate-landing: git fetch origin $BRANCH failed; cannot establish what to rebase onto."
                exit 1
              fi

              if ! git rebase "origin/$BRANCH"; then
                CONFLICTED="$(git diff --name-only --diff-filter=U 2>/dev/null || true)"
                git rebase --abort || true
                echo "::error::regenerate-landing: rebase onto origin/$BRANCH CONFLICTS. Aborted; nothing was pushed. This job will never auto-resolve a conflict, because README.md carries authored release copy."
                echo "Conflicted paths:"
                printf '%s\n' "$CONFLICTED" | sed -e 's/^/  /'
                exit 1
              fi

              PUSH_OUT="$(mktemp)"
              if git push origin "HEAD:$BRANCH" >"$PUSH_OUT" 2>&1; then
                cat "$PUSH_OUT"
                echo "regenerate-landing: landed on attempt $attempt/$MAX_ATTEMPTS."
                exit 0
              fi
              cat "$PUSH_OUT"

              # Only a LOST RACE is retryable. Anything else (auth, network, a protected ref)
              # will not heal by trying again, and looping on it hides the real cause — this
              # workflow's only two historical failures were a 403 from github-actions[bot].
              #
              # `cannot lock ref` is in this set because a lost race has TWO distinct shapes and
              # only one of them says "non-fast-forward". If the competing writer lands before
              # our fetch, git refuses locally: `! [rejected] (fetch first)`. If it lands DURING
              # the transfer — after git computed the refs to send, before the remote updated
              # them — the REMOTE refuses the compare-and-swap instead:
              #   remote: error: cannot lock ref 'refs/heads/main': is at c73aed7 but expected 97ffd67
              #   ! [remote rejected] HEAD -> main (failed to update ref)
              # Measured 2026-08-21 with a pre-push hook that lands a competing commit inside the
              # transfer window. Without this alternative the loop calls the tightest possible
              # instance of the race "not retryable" and gives up on attempt 1. Matching `cannot
              # lock ref` rather than the bare `[remote rejected]` is deliberate: a pre-receive
              # hook DECLINING a push also prints `[remote rejected]`, and retrying a refusing
              # gate is routing around it.
              if ! grep -qE 'non-fast-forward|fetch first|stale info|Updates were rejected|cannot lock ref' "$PUSH_OUT"; then
                echo "::error::regenerate-landing: push failed for a reason this job does not treat as retryable. Not retrying."
                exit 1
              fi

              if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then break; fi
              SLEEP=$(( 2 * attempt + (RANDOM % 3) ))
              echo "::warning::regenerate-landing: non-fast-forward — a writer OUTSIDE this workflow moved origin/$BRANCH. Attempt $attempt/$MAX_ATTEMPTS; re-fetching and rebasing in ${SLEEP}s."
              sleep "$SLEEP"
            done

            # Wording deliberately mirrors scripts/land.sh's own exhaustion path, so both sides
            # of the ref-main residual read identically to whoever is debugging at 3am.
            echo "::error::regenerate-landing: $MAX_ATTEMPTS attempts exhausted landing HEAD onto origin/$BRANCH. Every attempt was refused non-fast-forward, so a writer outside this workflow is landing faster than this job can rebase. Escalate rather than loop: see the residual-scope note in scripts/land.sh's header and the ref-main row in ops/shared-worktree-state.json."
            exit 1
          else
            echo "No surface changes; skipping commit."
          fi

