name: Regenerate Landing from Manifests

# WEBSITE-REFRESH-W1 C8 — receives `repository_dispatch` from algovault-skills
# (or manual workflow_dispatch). Checks out both repos as siblings, runs the
# manifest-driven build script, commits regenerated surfaces if changed, and
# pushes — which triggers the standard deploy.yml on the same branch.
#
# Total round-trip from manifest edit to live algovault.com update: ~2 min.

on:
  repository_dispatch:
    types: [manifest-changed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Self-trigger on direct edits of manifests if cross-repo sync is bypassed.
      # NOTE: this path won't typically fire because manifests live in the sibling
      # repo, but listed for safety in case someone vendors the manifests here.
      - 'skills/manifest.json'
      - 'integrations/manifest.json'

# ─── CONCURRENCY — OPS-SERIALIZE-LANDING-AND-DEPLOY-W1 CH3 ───────────────────────────────────
#
# THE GROUP KEY IS A FUNCTION OF THE RESOURCE, NEVER OF THE CONTAINER. That is this repo's
# existing freshness law ("a freshness key is a function of what it verifies, never of the
# container holding it") reappearing in a new domain. One set of landing surfaces, so ONE global group. This is also the CI writer named in the
# `ref-main` residual: it commits and pushes to main with a PAT (specifically so the push
# re-triggers deploy.yml), which means CI can move main underneath a local session and no local
# lock can prevent it. Hardening that is OPS-CI-MAIN-WRITER-HARDEN-W{NEXT}.
#
# `queue: max`, never the `single` default: waves cite run IDs as acceptance evidence, and a run
# cancelled while PENDING is not a failure anywhere — it is simply missing. `max` lets every run
# survive to a verdict. Proven ACCEPTED and MEASURED on a throwaway branch before any rollout
# (run 32396494418 validated and ran; two further runs dispatched into the same group both stayed
# `pending` rather than the earlier one being cancelled, which is `max` behaving as documented and
# is what the `single` default would NOT have done).
#
# The knob that governs PENDING runs is `queue`. The OTHER one is deliberately absent everywhere
# in this repo: it scopes to the in-progress run, its `false` value appears nowhere in GitHub's
# documentation, and combining it with `queue: max` is an explicit workflow validation error.
#
# Group names are CASE-INSENSITIVE per the docs — never rely on case to distinguish two groups.
#
# No job-level concurrency block: GitHub does not document how workflow-level and job-level
# groups interact, and a load-bearing safety property must never be rented from undocumented
# behaviour. Declared in ops/shared-worktree-state.json (`ci-workflow-regenerate-landing`) and asserted in BOTH
# directions by scripts/check-shared-state.mjs + tests/unit/workflow-concurrency.test.ts.
concurrency:
  group: ${{ github.workflow }}
  queue: max


permissions:
  # Default GITHUB_TOKEN is read-only on contents (per GitHub 2023+ org defaults).
  # The "Commit regenerated surfaces" step needs write access to push back to main.
  # The push triggers deploy.yml on the same branch (with [skip ci] tag in the
  # commit message to prevent the regenerate job from re-running on its own
  # commit — though deploy.yml fires regardless because that workflow doesn't
  # respect skip-ci tags; deploy is exactly what we want as the side effect).
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout crypto-quant-signal-mcp
        uses: actions/checkout@v4
        with:
          # Use a PAT for the checkout so subsequent `git push` is authenticated
          # as a user (not GITHUB_TOKEN). Pushes by GITHUB_TOKEN do NOT trigger
          # downstream workflow runs (anti-loop default); pushes by a PAT DO
          # trigger them — we need deploy.yml to fire on the regenerated
          # landing/* commit so the new files reach /var/www/algovault.
          # Reuses the same MCP_REPO_DISPATCH_TOKEN PAT that algovault-skills
          # uses to fire the dispatch (one PAT, two purposes — naming is
          # awkward but cuts secret-management surface).
          token: ${{ secrets.MCP_REPO_DISPATCH_TOKEN }}
          fetch-depth: 0

      - name: Checkout algovault-skills (in-workspace subdir)
        uses: actions/checkout@v4
        with:
          repository: AlgoVaultLabs/algovault-skills
          # actions/checkout confines paths to the workspace dir, so a sibling
          # `../algovault-skills` is rejected. Check into ./algovault-skills/
          # instead; the build script's __dirname-relative path resolution
          # (../scripts → ../) works identically inside the in-workspace subdir.
          path: algovault-skills
          fetch-depth: 1

      - name: Run build script
        run: |
          node algovault-skills/scripts/build_landing.mjs --target .

      - name: Clean up sibling-checkout (so it doesn't get committed in next step)
        run: rm -rf algovault-skills

      - name: Commit regenerated surfaces (if any)
        env:
          DISPATCH_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_ACTOR: ${{ github.event.client_payload.source_actor }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.email "ci@algovault.com"
            git config user.name "AlgoVault CI"
            git add landing/skills.html landing/index.html landing/llms.txt landing/llms-full.txt README.md
            # NOTE: no `[skip ci]` tag — we WANT deploy.yml to fire on this
            # commit so the regenerated landing/* files reach /var/www/algovault.
            # Recursion is impossible because regenerate-landing.yml's `push`
            # filter is restricted to `skills/manifest.json` and
            # `integrations/manifest.json` paths (which live in the sibling repo,
            # not here) — so its own commits to landing/* never re-fire it.
            git commit -m "build(landing): regenerate from manifests" -m "Triggered by repository_dispatch from ${DISPATCH_REPO:-self} (sha ${DISPATCH_SHA:-n/a}, actor ${DISPATCH_ACTOR:-n/a})."
            git push
          else
            echo "No surface changes; skipping commit."
          fi

